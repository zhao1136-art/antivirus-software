<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙箱分析 - 御天</title>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('御天_settings')||'{}');if(s.theme==='light')document.documentElement.classList.add('light');}catch(e){}}())</script>
    <style>
        :root{--bg-primary:#0a1f2e;--bg-secondary:#0e0e14;--bg-card:#13131c;--bg-hover:#1a1a26;--border:#252536;--border-light:#2f2f44;--text-primary:#f4f4f9;--text-secondary:#8f8fab;--text-muted:#5c5c75;--accent:#00bcd4;--accent-dim:rgba(0,188,212,0.12);--accent-glow:rgba(0,188,212,0.35);--danger:#ff4d6d;--danger-dim:rgba(255,77,109,0.12);--warning:#ffcc00;--success:#00bcd4;--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.06) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.05) 0%,transparent 40%),linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px;pointer-events:none;z-index:0}
        .app{display:flex;min-height:100vh;position:relative;z-index:1}
        .sidebar{width:72px;background:rgba(14,14,20,0.85);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 8px;position:fixed;height:100vh;z-index:100}
        .logo{display:flex;flex-direction:column;align-items:center;gap:0;padding:0;margin-bottom:24px}
        .logo-icon{width:40px;height:40px;border-radius:12px;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,188,212,0.25)}
        .logo-icon img{width:100%;height:100%;object-fit:cover}
        .logo-text{display:none}
        .nav{display:flex;flex-direction:column;align-items:center;width:100%;gap:6px;flex:1}
        .nav-item{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:12px;color:var(--text-secondary);text-decoration:none;font-size:0;font-weight:500;transition:var(--transition);cursor:pointer;border:1px solid transparent;position:relative}
        .nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
        .nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,188,212,0.2)}
        .nav-item svg{width:22px;height:22px;opacity:0.85}
        .nav-item.active svg{opacity:1}
        .nav-item[href="settings.html"]{margin-top:auto}
        .nav-badge{position:absolute;top:0;right:-2px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;border-radius:10px;border:2px solid var(--bg-primary);line-height:1.4}
        .nav-group{width:100%;text-align:center;padding:14px 0 6px;font-size:0;user-select:none;position:relative}.nav-group::before{content:'';display:block;width:20px;height:1px;background:var(--border);margin:0 auto}
        .main{flex:1;margin-left:72px;padding:32px 40px;max-width:calc(100% - 72px)}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
        .header-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:700}
        .header-meta{display:flex;align-items:center;gap:20px}
        .time{color:var(--text-secondary);font-size:13px;font-family:'Syne',sans-serif;font-weight:500}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;transition:var(--transition);margin-bottom:24px}
        .card:hover{border-color:var(--border-light)}
        .card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:24px}
        .card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .card-desc{font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:var(--transition);white-space:nowrap}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#00b4a6);color:#000;box-shadow:0 4px 16px var(--accent-glow)}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .btn-danger{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,77,109,0.2)}
        .btn-danger:hover{background:var(--danger);color:#fff}
        .btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
        .btn-outline:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-light)}
        .btn-sm{padding:6px 14px;font-size:12px}
/* 取消按钮：运行期间可见可点，结束后隐藏（取消是正常路径，用中性黄而非红色） */
.btn-cancel{background:transparent;color:var(--warning);border:1px solid var(--warning)}
.btn-cancel:hover:not(:disabled){background:rgba(255,204,0,0.12)}
.btn-cancel:disabled{opacity:0.55;cursor:default}
/* 轻量提示条（与 clean/optimize/guard 页面的 showToast 视觉一致） */
.toast{position:fixed;top:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--accent);color:var(--text-primary);font-size:13px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,0.35);transform:translateX(140%);transition:transform 0.25s ease;pointer-events:none}
.toast.show{transform:translateX(0)}
        .status-tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px}
        .status-tag.ok{background:var(--accent-dim);color:var(--accent)}
        .status-tag.fail{background:var(--danger-dim);color:var(--danger)}
        .status-tag.warn{background:rgba(255,204,0,0.1);color:var(--warning)}
        .stat-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-hover);border-radius:20px;font-size:12px;font-weight:600;color:var(--text-secondary)}
        .stat-chip svg{width:14px;height:14px}
        .sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
        .data-table{width:100%;border-collapse:collapse;font-size:13px}
        .data-table th{text-align:left;padding:10px 12px;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
        .data-table td{padding:12px;border-bottom:1px solid var(--border);color:var(--text-primary)}
        .data-table tr:hover td{background:var(--bg-hover)}
        .data-table tr:last-child td{border-bottom:none}
        .empty-row{text-align:center;color:var(--text-muted);padding:24px;font-style:italic}
        .table-wrap{overflow-x:auto}
        /* 拖拽区 */
        .drop-zone{border:2px dashed var(--border-light);border-radius:var(--radius-md);padding:48px 24px;text-align:center;transition:var(--transition);cursor:pointer;background:var(--bg-secondary)}
        .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:var(--accent-dim)}
        .drop-zone svg{width:48px;height:48px;color:var(--accent);margin-bottom:16px;opacity:0.8}
        .drop-zone .dz-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:600;margin-bottom:8px}
        .drop-zone .dz-sub{font-size:13px;color:var(--text-muted)}
        .drop-zone .dz-file{margin-top:12px;font-size:13px;color:var(--accent);font-weight:600;font-family:'Courier New',monospace}
        /* 进度 */
        .progress-bar{width:100%;height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;margin:16px 0}
        .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),#00b4a6);transition:width 0.3s;width:0%}
        .log-stream{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-family:'Courier New',monospace;font-size:12px;color:var(--text-primary);max-height:260px;overflow-y:auto;line-height:1.7;white-space:pre-wrap}
        .log-stream .log-line{padding:2px 0}
        .log-stream .log-time{color:var(--text-muted);margin-right:8px}
        .log-stream .log-info{color:var(--accent)}
        .log-stream .log-warn{color:var(--warning)}
        .log-stream .log-danger{color:var(--danger)}
        /* 判定结果大标签 */
        .verdict{display:flex;align-items:center;gap:20px;padding:20px;border-radius:var(--radius-md);margin-bottom:20px}
        .verdict.clean{background:var(--accent-dim);border:1px solid rgba(0,188,212,0.3)}
        .verdict.suspicious{background:rgba(255,204,0,0.1);border:1px solid rgba(255,204,0,0.3)}
        .verdict.malicious{background:var(--danger-dim);border:1px solid rgba(255,77,109,0.3)}
        .verdict-icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
        .verdict.clean .verdict-icon{background:var(--accent);color:#000}
        .verdict.suspicious .verdict-icon{background:var(--warning);color:#000}
        .verdict.malicious .verdict-icon{background:var(--danger);color:#fff}
        .verdict-icon svg{width:30px;height:30px}
        .verdict-label{font-family:'Syne',sans-serif;font-size:22px;font-weight:700}
        .verdict.clean .verdict-label{color:var(--accent)}
        .verdict.suspicious .verdict-label{color:var(--warning)}
        .verdict.malicious .verdict-label{color:var(--danger)}
        .verdict-score{font-size:13px;color:var(--text-secondary);margin-top:4px}
        .indicator-list{list-style:none;padding:0}
        .indicator-list li{padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13px;display:flex;align-items:center;gap:10px}
        .indicator-list li .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .indicator-list li.high .dot{background:var(--danger)}
        .indicator-list li.med .dot{background:var(--warning)}
        .indicator-list li.low .dot{background:var(--accent)}
        .behavior-list{list-style:none;padding:0}
        .behavior-list li{padding:10px 12px;border-left:3px solid var(--border);margin-bottom:6px;font-size:13px;background:var(--bg-secondary);border-radius:0 8px 8px 0}
        .behavior-list li.danger{border-left-color:var(--danger)}
        .behavior-list li.warn{border-left-color:var(--warning)}
        .behavior-list li.info{border-left-color:var(--accent)}
        .action-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;text-transform:uppercase}
        .action-tag.allow{background:var(--accent-dim);color:var(--accent)}
        .action-tag.block{background:var(--danger-dim);color:var(--danger)}
        .action-tag.alert{background:rgba(255,204,0,0.1);color:var(--warning)}
        .report-section{display:none}
        .report-section.show{display:block}
        .progress-section{display:none}
        .progress-section.show{display:block}
        html.light{--bg-primary:#f5f5f8;--bg-secondary:#eeeef3;--bg-card:#ffffff;--bg-hover:#e8e8f0;--border:#d8d8e4;--border-light:#c8c8d4;--text-primary:#1a1a2e;--text-secondary:#5a5a6e;--text-muted:#8a8a9e}
        html.light body::before{background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.04) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.03) 0%,transparent 40%),linear-gradient(rgba(0,0,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.02) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px}
        html.light .sidebar{background:rgba(255,255,255,0.85)}
        @media(max-width:1100px){.sb-grid{grid-template-columns:1fr}}
        @media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;max-width:100%;padding:24px}}
        .nav-item:hover::after{content:attr(data-title);position:absolute;left:100%;margin-left:14px;background:var(--bg-card);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;z-index:300;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.4)}.nav-item.active:hover::after{border-color:rgba(0,188,212,0.3);color:var(--accent)}
    </style>
    <style>
        /* ---------- 统一导航增强：Logo / 移动端汉堡菜单 ---------- */
        .logo { padding: 0; margin-bottom: 22px; }
        .logo-icon { color: var(--accent); }
        .logo-icon svg { width: 26px; height: 26px; }
        .nav-toggle {
            display: none; position: fixed; top: 14px; left: 14px; z-index: 200;
            width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
            align-items: center; justify-content: center;
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-primary); box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .nav-toggle svg { width: 20px; height: 20px; }
        .nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 150; }
        .nav-overlay.show { display: block; }
        @media (max-width: 768px) {
            .nav-toggle { display: flex; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
            .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.4); }
            .main { margin-left: 0; max-width: 100%; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo" title="安盾安全">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
            </div>
        </div>
        <nav class="nav">
            <div class="nav-group"></div>
            <a class="nav-item" href="index.html" data-title="概览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>概览</a>
            <a class="nav-item" href="scan.html" data-title="病毒扫描"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94M9.69 16 3.95 6.06M14.31 16H2.83M16.62 12l-5.74 9.94"/></svg>病毒扫描</a>
            <a class="nav-item" href="guard.html" data-title="卫士体检"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>卫士体检</a>
            <a class="nav-item" href="clean.html" data-title="垃圾清理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>垃圾清理</a>
            <a class="nav-item" href="optimize.html" data-title="电脑优化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>电脑优化</a>
            <a class="nav-item" href="history.html" data-title="病毒记忆"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/><path d="M3.05 11a9 9 0 1 1 .5 4"/></svg>病毒记忆</a>
            <div class="nav-group"></div>

            <a class="nav-item" href="logs.html" data-title="日志报告"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>日志报告</a>
            <div class="nav-group"></div>
            <a class="nav-item active" href="tools.html" data-title="安全工具"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>安全工具</a>

            <div class="nav-group"></div>

        </nav>
    </aside>

    <main class="main">
        <header class="header">
            <h1 class="header-title">沙箱分析</h1>
            <div class="header-meta"><span class="time" id="clock">--:--</span></div>
        </header>

        <!-- 文件选择 -->
        <div class="card">
            <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>文件选择</h3>
            <div class="drop-zone" id="dropZone" onclick="pickFile()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <div class="dz-title">拖拽文件到此处，或点击选择文件</div>
                <div class="dz-sub">支持可执行文件、脚本、文档等，最大 50MB</div>
                <div class="dz-file" id="dzFile" style="display:none"></div>
            </div>
            <input type="file" id="fileInput" style="display:none" onchange="onFilePicked(this.files[0])">
            <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
                <button class="btn btn-primary" id="analyzeBtn" onclick="startAnalyze()" disabled>开始分析</button>
                <button class="btn btn-cancel" id="btnCancelAnalyze" onclick="cancelAnalyze()" style="display:none">
                    <span>取消分析</span>
                </button>
                <button class="btn btn-outline" onclick="loadHistory()">刷新历史</button>
            </div>
        </div>

        <!-- 分析进度 -->
        <div class="card progress-section" id="progressSection">
            <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>分析进度</h3>
            <div class="card-row">
                <span id="progressLabel">准备中...</span>
                <span class="stat-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="progressPct">0%</span></span>
            </div>
            <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
            <div class="log-stream" id="logStream"></div>
        </div>

        <!-- 分析报告 -->
        <div class="card report-section" id="reportSection">
            <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>分析报告</h3>
            <div id="verdictBox"></div>
            <div class="sb-grid" style="margin-top:20px">
                <div>
                    <h4 style="font-family:'Syne',sans-serif;font-size:13px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px">行为列表</h4>
                    <ul class="behavior-list" id="behaviorList"><li class="info">暂无行为记录</li></ul>
                </div>
                <div>
                    <h4 style="font-family:'Syne',sans-serif;font-size:13px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px">风险指标</h4>
                    <ul class="indicator-list" id="indicatorList"><li class="low"><span class="dot"></span>暂无风险指标</li></ul>
                </div>
            </div>
            <div style="margin-top:20px">
                <h4 style="font-family:'Syne',sans-serif;font-size:13px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px">网络活动</h4>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead><tr><th>时间</th><th>协议</th><th>目标地址</th><th>端口</th><th>进程</th></tr></thead>
                        <tbody id="netBody"><tr><td colspan="5" class="empty-row">暂无网络活动</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 历史分析记录 -->
        <div class="card">
            <div class="card-row">
                <h3 class="card-title" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/><path d="M3.05 11a9 9 0 1 1 .5 4"/></svg>历史分析记录</h3>
                <button class="btn btn-outline btn-sm" onclick="loadHistory()">刷新</button>
            </div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>时间</th><th>文件名</th><th>大小</th><th>判定</th><th>评分</th><th>操作</th></tr></thead>
                    <tbody id="historyBody"><tr><td colspan="6" class="empty-row">暂无记录</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_BASE = ''; // 动态适配当前 origin

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent =
            String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
    updateClock();
    setInterval(updateClock, 1000);

    (function() {
        try {
            var q = JSON.parse(localStorage.getItem('御天_quarantine') || '[]');
            var el = document.getElementById('quarantineBadge');
            if (el) el.textContent = q.length || '0';
        } catch(e) {}
    })();

    async function apiGet(path) {
        try { const r = await fetch(API_BASE + path); return await r.json(); }
        catch(e) { console.warn(e); return null; }
    }
    async function apiPost(path, body) {
        try {
            const r = await fetch(API_BASE + path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
            return await r.json();
        } catch(e) { console.warn(e); return null; }
    }
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

    // ── 提示条 ──
    let toastTimer = null;
    function showToast(msg, isError, isWarn) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.style.borderLeftColor = isWarn ? 'var(--warning)' : (isError ? 'var(--danger)' : 'var(--accent)');
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // ── 取消按钮显隐 ──
    function setCancelBtn(id, visible, busy, busyText, normalText) {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.style.display = visible ? 'inline-flex' : 'none';
        btn.disabled = !!busy;
        const span = btn.querySelector('span');
        if (span) span.textContent = busy ? busyText : normalText;
    }

    let selectedFile = null;
    let pollTimer = null;
    let currentTaskId = null;

    // 文件选择
    function pickFile() { document.getElementById('fileInput').click(); }
    function onFilePicked(f) {
        if (!f) return;
        selectedFile = f;
        const dzFile = document.getElementById('dzFile');
        dzFile.textContent = f.name + ' (' + (f.size/1024).toFixed(1) + ' KB)';
        dzFile.style.display = 'block';
        document.getElementById('analyzeBtn').disabled = false;
    }
    const dropZone = document.getElementById('dropZone');
    ['dragenter','dragover'].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.classList.add('dragover');}));
    ['dragleave','drop'].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.classList.remove('dragover');}));
    dropZone.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) onFilePicked(e.dataTransfer.files[0]); });

    function appendLog(level, msg) {
        const stream = document.getElementById('logStream');
        const time = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${level}">${esc(msg)}</span>`;
        stream.appendChild(line);
        stream.scrollTop = stream.scrollHeight;
    }

    function setProgress(pct, label) {
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPct').textContent = pct + '%';
        if (label) document.getElementById('progressLabel').textContent = label;
    }

    // 开始分析：上传文件 → 后端创建可取消的沙箱分析任务
    async function startAnalyze() {
        if (!selectedFile) { alert('请先选择文件'); return; }
        document.getElementById('analyzeBtn').disabled = true;
        document.getElementById('progressSection').classList.add('show');
        document.getElementById('reportSection').classList.remove('show');
        document.getElementById('logStream').innerHTML = '';
        setProgress(0, '上传文件中...');

        appendLog('info', '开始分析: ' + selectedFile.name);

        const formData = new FormData();
        formData.append('file', selectedFile);
        let resp = null;
        try {
            const r = await fetch(API_BASE + '/api/v1/sandbox/upload', { method:'POST', body: formData });
            resp = await r.json();
        } catch(e) { console.warn(e); }

        if (!resp || !resp.task_id) {
            appendLog('danger', '上传/分析接口不可用');
            showToast('沙箱分析启动失败', true);
            document.getElementById('analyzeBtn').disabled = false;
            setProgress(0, '分析未启动');
            return;
        }
        currentTaskId = resp.task_id;
        appendLog('info', '已提交分析，任务ID: ' + currentTaskId);
        setProgress(5, '已加入分析队列');
        setCancelBtn('btnCancelAnalyze', true, false, '正在取消…', '取消分析');

        // 轮询通用可取消任务状态
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(async () => {
            const st = await apiGet('/api/v1/jobs/' + currentTaskId + '/status');
            if (!st) { clearInterval(pollTimer); pollTimer = null; finishAnalyze(null); return; }
            if (st.status === 'queued' || st.status === 'running') {
                if (st.current) appendLog('info', st.current);
                setProgress(Math.max(5, st.progress || 5), st.current || '分析中...');
                return;
            }
            clearInterval(pollTimer);
            pollTimer = null;
            finishAnalyze(st);
        }, 800);
    }

    function finishAnalyze(st) {
        setCancelBtn('btnCancelAnalyze', false, false, '正在取消…', '取消分析');
        document.getElementById('analyzeBtn').disabled = false;
        currentTaskId = null;
        if (st === null) {
            setProgress(0, '分析中断');
            appendLog('warn', '无法获取分析状态');
            showToast('无法获取分析状态', true);
            return;
        }
        if (st.status === 'cancelled') {
            // 取消是正常路径：中性黄提示，进度条停在当前位置
            setProgress(Math.max(5, st.progress || 5), '分析已取消');
            appendLog('warn', '分析已取消（沙箱进程已终止）');
            showToast('沙箱分析已取消', false, true);
            return;
        }
        if (st.status === 'failed') {
            setProgress(0, '分析失败');
            appendLog('danger', '分析失败: ' + (st.error || '未知错误'));
            showToast('分析失败：' + (st.error || '未知错误'), true);
            return;
        }
        const report = st.result || {};
        setProgress(100, '分析完成');
        appendLog('info', '分析完成');
        renderReport(report);
        loadHistory();
    }

    async function cancelAnalyze() {
        if (!currentTaskId) return;
        setCancelBtn('btnCancelAnalyze', true, true, '正在取消…', '取消分析');
        // 后端会立刻 TerminateJobObject 杀掉沙箱进程，而不是只改前端状态
        await apiPost('/api/v1/jobs/' + currentTaskId + '/cancel');
        appendLog('warn', '已请求取消，正在终止沙箱进程…');
        showToast('已请求取消分析，正在停止…', false, true);
    }

    function renderReport(report) {
        document.getElementById('reportSection').classList.add('show');
        const verdict = (report.verdict || report.classification || 'clean').toLowerCase();
        const score = report.score != null ? report.score : (report.risk_score != null ? report.risk_score : 0);
        const verdictBox = document.getElementById('verdictBox');
        const cls = verdict.includes('mal') ? 'malicious' : (verdict.includes('susp') ? 'suspicious' : 'clean');
        const label = cls === 'malicious' ? '恶意' : (cls === 'suspicious' ? '可疑' : '安全');
        const iconPath = cls === 'malicious'
            ? '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
            : (cls === 'suspicious' ? '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>'
                                   : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>');
        verdictBox.innerHTML = `<div class="verdict ${cls}">
            <div class="verdict-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconPath}</svg></div>
            <div><div class="verdict-label">${label}</div><div class="verdict-score">风险评分: ${score} / 100</div></div>
        </div>`;

        // 行为列表
        const behaviors = report.behaviors || [];
        const bList = document.getElementById('behaviorList');
        if (behaviors.length) {
            bList.innerHTML = behaviors.map(b=>{
                const lvl = (b.severity||b.level||'').toLowerCase();
                const cls = lvl.includes('high')||lvl.includes('danger')?'danger':(lvl.includes('med')||lvl.includes('warn')?'warn':'info');
                return `<li class="${cls}">${esc(b.description||b.message||b)}</li>`;
            }).join('');
        } else { bList.innerHTML = '<li class="info">暂无行为记录</li>'; }

        // 风险指标
        const indicators = report.indicators || report.iocs || [];
        const iList = document.getElementById('indicatorList');
        if (indicators.length) {
            iList.innerHTML = indicators.map(ind=>{
                const sev = (ind.severity||'').toLowerCase();
                const cls = sev.includes('high')?'high':(sev.includes('med')?'med':'low');
                return `<li class="${cls}"><span class="dot"></span>${esc(ind.description||ind.name||ind)}</li>`;
            }).join('');
        } else { iList.innerHTML = '<li class="low"><span class="dot"></span>暂无风险指标</li>'; }

        // 网络活动
        const net = report.network_activities || report.network || [];
        const nBody = document.getElementById('netBody');
        if (net.length) {
            nBody.innerHTML = net.map(n=>`<tr>
                <td>${esc(n.time||'—')}</td>
                <td>${esc(n.protocol||'—')}</td>
                <td>${esc(n.remote||n.destination||n.ip||'—')}</td>
                <td>${esc(n.port||'—')}</td>
                <td>${esc(n.process||'—')}</td>
            </tr>`).join('');
        } else { nBody.innerHTML = '<tr><td colspan="5" class="empty-row">暂无网络活动</td></tr>'; }
    }

    // 历史记录
    async function loadHistory() {
        const data = await apiGet('/api/v1/sandbox/history');
        const body = document.getElementById('historyBody');
        const list = (data && (data.history || data.records)) || [];
        if (!list.length) { body.innerHTML = '<tr><td colspan="6" class="empty-row">暂无记录</td></tr>'; return; }
        body.innerHTML = list.map(h=>{
            const verdict = (h.verdict||h.classification||'clean').toLowerCase();
            const cls = verdict.includes('mal')?'malicious':(verdict.includes('susp')?'suspicious':'clean');
            const tag = cls==='malicious'?'<span class="action-tag block">恶意</span>':(cls==='suspicious'?'<span class="action-tag alert">可疑</span>':'<span class="action-tag allow">安全</span>');
            return `<tr>
                <td>${esc(h.time||h.timestamp||'—')}</td>
                <td style="font-family:'Courier New',monospace;font-size:12px">${esc(h.filename||h.name||'—')}</td>
                <td>${esc(h.size||'—')}</td>
                <td>${tag}</td>
                <td>${esc(h.score!=null?h.score:(h.risk_score!=null?h.risk_score:'—'))}</td>
                <td><button class="btn btn-outline btn-sm" onclick='loadReport(${JSON.stringify(h).replace(/'/g,"\\'")})'>查看</button></td>
            </tr>`;
        }).join('');
    }
    function loadReport(h) {
        document.getElementById('progressSection').classList.remove('show');
        renderReport(h.report || { verdict:h.verdict, score:h.score, behaviors:[], indicators:[], network_activities:[] });
        window.scrollTo({ top: document.getElementById('reportSection').offsetTop - 20, behavior:'smooth' });
    }

    window.addEventListener('load', () => {
        loadHistory();
    });
</script>

    <!-- 移动端导航：汉堡按钮 + 遮罩 -->
    <button class="nav-toggle" id="navToggle" aria-label="打开导航" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-overlay" id="navOverlay"></div>
    <script>
    // 移动端汉堡菜单切换：点击按钮展开/收起侧栏，遮罩或 Esc 关闭
    (function () {
        var btn = document.getElementById('navToggle');
        var overlay = document.getElementById('navOverlay');
        var sidebar = document.querySelector('.sidebar');
        if (!btn || !sidebar) return;
        function setOpen(open) {
            sidebar.classList.toggle('open', open);
            if (overlay) overlay.classList.toggle('show', open);
            btn.setAttribute('aria-expanded', String(open));
        }
        btn.addEventListener('click', function () { setOpen(!sidebar.classList.contains('open')); });
        if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
    </script>
    <script src="/static/decision_popup.js"></script>
</body>
</html>
