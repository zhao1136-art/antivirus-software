<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防火墙 - 御天</title><script>(function(){try{var s=JSON.parse(localStorage.getItem('御天_settings')||'{}');if(s.theme==='light')document.documentElement.classList.add('light');}catch(e){}}())</script>
    <style>
        :root{--bg-primary:#0a1f2e;--bg-secondary:#0e0e14;--bg-card:#13131c;--bg-hover:#1a1a26;--border:#252536;--border-light:#2f2f44;--text-primary:#f4f4f9;--text-secondary:#8f8fab;--text-muted:#5c5c75;--accent:#00bcd4;--accent-dim:rgba(0,188,212,0.12);--accent-glow:rgba(0,188,212,0.35);--danger:#ff4d6d;--danger-dim:rgba(255,77,109,0.12);--warning:#ffcc00;--success:#00bcd4;--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.06) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.05) 0%,transparent 40%),linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px;pointer-events:none;z-index:0}
        .app{display:flex;min-height:100vh;position:relative;z-index:1}
        .sidebar{width:72px;background:rgba(14,14,20,0.85);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 8px;position:fixed;height:100vh;z-index:100}
        .logo{display:flex;flex-direction:column;align-items:center;gap:0;padding:0;margin-bottom:24px}
        .logo-icon{width:40px;height:40px;border-radius:12px;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,188,212,0.25)}
        .logo-icon img{width:100%;height:100%;object-fit:cover}
        .logo-text{display:none}
        .nav{display:flex;flex-direction:column;align-items:center;width:100%;gap:6px;flex:1}
        .nav-item{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:12px;color:var(--text-secondary);text-decoration:none;font-size:0;font-weight:500;transition:var(--transition);cursor:pointer;border:1px solid transparent;position:relative}
        .nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
        .nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,188,212,0.2)}
        .nav-item svg{width:22px;height:22px;opacity:0.85}
        .nav-item.active svg{opacity:1}
        .nav-item[href="settings.html"]{margin-top:auto}
        .nav-badge{position:absolute;top:0;right:-2px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;border-radius:10px;border:2px solid var(--bg-primary);line-height:1.4}
        .nav-group{width:100%;text-align:center;padding:14px 0 6px;font-size:0;user-select:none;position:relative}.nav-group::before{content:'';display:block;width:20px;height:1px;background:var(--border);margin:0 auto}
        .main{flex:1;margin-left:72px;padding:32px 40px;max-width:calc(100% - 72px)}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
        .header-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:700}
        .header-meta{display:flex;align-items:center;gap:20px}
        .time{color:var(--text-secondary);font-size:13px;font-family:'Syne',sans-serif;font-weight:500}
        .fw-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
        .fw-grid.full{grid-template-columns:1fr}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;transition:var(--transition)}
        .card:hover{border-color:var(--border-light)}
        .card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:24px}
        .card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .card-desc{font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:var(--transition);white-space:nowrap}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#00b4a6);color:#000;box-shadow:0 4px 16px var(--accent-glow)}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
        .btn-danger{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,77,109,0.2)}
        .btn-danger:hover{background:var(--danger);color:#fff}
        .btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
        .btn-outline:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-light)}
        .btn-sm{padding:6px 14px;font-size:12px}
        .toggle{width:48px;height:26px;background:var(--bg-hover);border-radius:20px;position:relative;cursor:pointer;transition:var(--transition);border:1px solid var(--border-light);flex-shrink:0}
        .toggle.active{background:var(--accent);border-color:var(--accent)}
        .toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:white;border-radius:50%;transition:var(--transition);box-shadow:0 2px 6px rgba(0,0,0,0.2)}
        .toggle.active::after{transform:translateX(22px)}
        .status-tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px}
        .status-tag.ok{background:var(--accent-dim);color:var(--accent)}
        .status-tag.fail{background:var(--danger-dim);color:var(--danger)}
        .status-tag.warn{background:rgba(255,204,0,0.1);color:var(--warning)}
        .stat-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-hover);border-radius:20px;font-size:12px;font-weight:600;color:var(--text-secondary)}
        .stat-chip svg{width:14px;height:14px}
        .input-text{padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:var(--transition);flex:1;min-width:120px}
        .input-text:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
        .input-text::placeholder{color:var(--text-muted)}
        select.input-text{appearance:none;cursor:pointer}
        .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
        .form-row label{font-size:12px;color:var(--text-secondary);min-width:50px;font-weight:600}
        .data-table{width:100%;border-collapse:collapse;font-size:13px}
        .data-table th{text-align:left;padding:10px 12px;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
        .data-table td{padding:12px;border-bottom:1px solid var(--border);color:var(--text-primary)}
        .data-table tr:hover td{background:var(--bg-hover)}
        .data-table tr:last-child td{border-bottom:none}
        .empty-row{text-align:center;color:var(--text-muted);padding:24px;font-style:italic}
        .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:8px}
        .stat-box{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;text-align:center}
        .stat-box .num{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:var(--accent);line-height:1}
        .stat-box .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:8px}
        .conn-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}
        .conn-status.established{background:var(--accent-dim);color:var(--accent)}
        .conn-status.listen{background:rgba(255,204,0,0.1);color:var(--warning)}
        .conn-status.close{background:var(--danger-dim);color:var(--danger)}
        .action-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;text-transform:uppercase}
        .action-tag.allow{background:var(--accent-dim);color:var(--accent)}
        .action-tag.block{background:var(--danger-dim);color:var(--danger)}
        .list-tags{display:flex;flex-wrap:wrap;gap:6px}
        .tag-item{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg-hover);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-primary)}
        .tag-item .remove{cursor:pointer;color:var(--danger);font-weight:700;font-size:14px;line-height:1}
        html.light{--bg-primary:#f5f5f8;--bg-secondary:#eeeef3;--bg-card:#ffffff;--bg-hover:#e8e8f0;--border:#d8d8e4;--border-light:#c8c8d4;--text-primary:#1a1a2e;--text-secondary:#5a5a6e;--text-muted:#8a8a9e}
        html.light body::before{background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.04) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.03) 0%,transparent 40%),linear-gradient(rgba(0,0,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.02) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px}
        html.light .sidebar{background:rgba(255,255,255,0.85)}
        .table-wrap{overflow-x:auto}
        @media(max-width:1100px){.fw-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr}}
        @media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;max-width:100%;padding:24px}}
        .nav-item:hover::after{content:attr(data-title);position:absolute;left:100%;margin-left:14px;background:var(--bg-card);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;z-index:300;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.4)}.nav-item.active:hover::after{border-color:rgba(0,188,212,0.3);color:var(--accent)}
    </style>
    <style>
        /* ---------- 统一导航增强：Logo / 移动端汉堡菜单 ---------- */
        .logo { padding: 0; margin-bottom: 22px; }
        .logo-icon { color: var(--accent); }
        .logo-icon svg { width: 26px; height: 26px; }
        .nav-toggle {
            display: none; position: fixed; top: 14px; left: 14px; z-index: 200;
            width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
            align-items: center; justify-content: center;
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-primary); box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .nav-toggle svg { width: 20px; height: 20px; }
        .nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 150; }
        .nav-overlay.show { display: block; }
        @media (max-width: 768px) {
            .nav-toggle { display: flex; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
            .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.4); }
            .main { margin-left: 0; max-width: 100%; }
        }
    </style>
</head>

<div class="app">

    <main class="main">
        <header class="header">
            <h1 class="header-title">防火墙</h1>
            <div class="header-meta"><span class="time" id="clock">--:--</span></div>
        </header>

        <!-- 拦截统计 -->
        <div class="card" style="margin-bottom:24px">
            <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>拦截统计</h3>
            <div class="stat-grid">
                <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">总事件数</div></div>
                <div class="stat-box"><div class="num" id="statBlocked">0</div><div class="lbl">拦截数</div></div>
                <div class="stat-box"><div class="num" id="statRules">0</div><div class="lbl">活跃规则数</div></div>
            </div>
        </div>

        <div class="fw-grid">
            <!-- 总开关 -->
            <div class="card">
                <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>防火墙总开关</h3>
                <p class="card-desc">开启后将对所有进出网络流量应用规则匹配</p>
                <div class="card-row">
                    <span>防火墙保护</span>
                    <div class="toggle" id="toggleFirewall" onclick="toggleFirewall()"></div>
                </div>
                <div class="card-row">
                    <span class="stat-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>状态: <strong id="fwStatus">未启用</strong></span>
                </div>
            </div>

            <!-- 进程联网控制 -->
            <div class="card">
                <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51"/></svg>进程联网控制</h3>
                <p class="card-desc">阻止指定进程访问网络</p>
                <div class="form-row">
                    <input type="text" class="input-text" id="procInput" placeholder="进程名，例如：malware.exe">
                    <button class="btn btn-primary btn-sm" onclick="addBlockedProcess()">添加阻止</button>
                </div>
                <div class="list-tags" id="blockedProcList">
                    <div class="empty-row" style="width:100%">暂无阻止进程</div>
                </div>
            </div>

            <!-- 添加规则表单 -->
            <div class="card" style="grid-column:1/-1">
                <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加规则</h3>
                <div class="form-row">
                    <label>IP</label><input type="text" class="input-text" id="ruleIp" placeholder="例如 192.168.1.1 或 *">
                    <label>端口</label><input type="text" class="input-text" id="rulePort" placeholder="例如 80 或 *" style="max-width:120px">
                    <label>协议</label>
                    <select class="input-text" id="ruleProto" style="max-width:120px">
                        <option value="TCP">TCP</option>
                        <option value="UDP">UDP</option>
                        <option value="ANY">ANY</option>
                    </select>
                    <label>动作</label>
                    <select class="input-text" id="ruleAction" style="max-width:120px">
                        <option value="allow">允许</option>
                        <option value="block">阻止</option>
                    </select>
                    <button class="btn btn-primary" onclick="addRule()">添加规则</button>
                </div>
            </div>

            <!-- 规则列表 -->
            <div class="card" style="grid-column:1/-1">
                <div class="card-row">
                    <h3 class="card-title" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>规则列表</h3>
                    <button class="btn btn-outline btn-sm" onclick="loadRules()">刷新</button>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead><tr><th>IP</th><th>端口</th><th>协议</th><th>动作</th><th>来源</th><th>操作</th></tr></thead>
                        <tbody id="rulesBody"><tr><td colspan="6" class="empty-row">暂无规则</td></tr></tbody>
                    </table>
                </div>
            </div>

            <!-- 实时连接 -->
            <div class="card" style="grid-column:1/-1">
                <div class="card-row">
                    <h3 class="card-title" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>实时连接</h3>
                    <button class="btn btn-outline btn-sm" onclick="loadConnections()">刷新</button>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead><tr><th>进程</th><th>本地地址</th><th>远程地址</th><th>状态</th></tr></thead>
                        <tbody id="connBody"><tr><td colspan="4" class="empty-row">暂无连接</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const API_BASE = ''; // 动态适配当前 origin

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent =
            String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
    updateClock();
    setInterval(updateClock, 1000);

    (function() {
        try {
            var q = JSON.parse(localStorage.getItem('御天_quarantine') || '[]');
            var el = document.getElementById('quarantineBadge');
            if (el) el.textContent = q.length || '0';
        } catch(e) {}
    })();

    async function apiGet(path) {
        try { const r = await fetch(API_BASE + path); return await r.json(); }
        catch(e) { console.warn(e); return null; }
    }
    async function apiPost(path, body) {
        try {
            const r = await fetch(API_BASE + path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
            return await r.json();
        } catch(e) { console.warn(e); return null; }
    }

    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

    // 总开关
    async function toggleFirewall() {
        const el = document.getElementById('toggleFirewall');
        const newState = !el.classList.contains('active');
        el.classList.toggle('active', newState);
        const data = await apiPost('/api/v1/firewall/toggle', { module:'firewall', enabled:newState });
        if (data) { el.classList.toggle('active', !!data.enabled); updateFwStatus(data.enabled); }
        else { updateFwStatus(newState); }
    }
    function updateFwStatus(en){document.getElementById('fwStatus').textContent = en ? '已启用' : '未启用';}

    // 统计
    async function loadStats() {
        const data = await apiGet('/api/v1/firewall/stats');
        if (!data) return;
        document.getElementById('statTotal').textContent = data.total_events || 0;
        document.getElementById('statBlocked').textContent = data.blocked_count || 0;
        document.getElementById('statRules').textContent = data.active_rules || 0;
        const el = document.getElementById('toggleFirewall');
        el.classList.toggle('active', !!data.enabled);
        updateFwStatus(!!data.enabled);
    }

    // 规则列表
    async function loadRules() {
        const data = await apiGet('/api/v1/firewall/rules');
        const body = document.getElementById('rulesBody');
        const rules = (data && data.rules) || [];
        if (!rules.length) { body.innerHTML = '<tr><td colspan="6" class="empty-row">暂无规则</td></tr>'; return; }
        body.innerHTML = rules.map((r,i)=>`<tr>
            <td>${esc(r.ip)}</td>
            <td>${esc(r.port)}</td>
            <td>${esc(r.protocol)}</td>
            <td><span class="action-tag ${r.action==='allow'?'allow':'block'}">${r.action==='allow'?'允许':'阻止'}</span></td>
            <td>${esc(r.source||'手动')}</td>
            <td><button class="btn btn-danger btn-sm" onclick="delRule(${i},'${esc(r.id||'')}')">删除</button></td>
        </tr>`).join('');
    }
    async function addRule() {
        const body = {
            ip: document.getElementById('ruleIp').value.trim() || '*',
            port: parseInt(document.getElementById('rulePort').value) || 0,
            protocol: document.getElementById('ruleProto').value,
            action: document.getElementById('ruleAction').value,
            description: ''
        };
        if (!body.ip) { alert('请输入 IP'); return; }
        const r = await apiPost('/api/v1/firewall/rule/add', body);
        if (r) { document.getElementById('ruleIp').value=''; document.getElementById('rulePort').value=''; loadRules(); loadStats(); }
    }
    async function delRule(idx, id) {
        if (!confirm('确认删除该规则？')) return;
        const r = await apiPost('/api/v1/firewall/rule/remove', { rule_id: parseInt(id) || id });
        if (r) { loadRules(); loadStats(); }
    }

    // 进程联网控制
    async function loadBlockedProcesses() {
        const data = await apiGet('/api/v1/firewall/blocked-processes');
        const list = document.getElementById('blockedProcList');
        const procs = (data && data.processes) || [];
        if (!procs.length) { list.innerHTML = '<div class="empty-row" style="width:100%">暂无阻止进程</div>'; return; }
        list.innerHTML = procs.map((p,i)=>`<div class="tag-item">${esc(p.name||p)}<span class="remove" onclick="removeBlockedProcess(${i},'${esc(p.id||p.name||p)}')">×</span></div>`).join('');
    }
    async function addBlockedProcess() {
        const name = document.getElementById('procInput').value.trim();
        if (!name) { alert('请输入进程名'); return; }
        const r = await apiPost('/api/v1/firewall/blocked-processes', { name:name });
        if (r) { document.getElementById('procInput').value=''; loadBlockedProcesses(); }
    }
    async function removeBlockedProcess(idx, id) {
        const r = await apiPost('/api/v1/firewall/blocked-processes/delete', { index:idx, id:id });
        if (r) loadBlockedProcesses();
    }

    // 实时连接
    async function loadConnections() {
        const data = await apiGet('/api/v1/firewall/connections');
        const body = document.getElementById('connBody');
        const conns = (data && data.connections) || [];
        if (!conns.length) { body.innerHTML = '<tr><td colspan="4" class="empty-row">暂无连接</td></tr>'; return; }
        body.innerHTML = conns.map(c=>{
            const st = (c.status||'').toLowerCase();
            const cls = st.includes('listen')?'listen':(st.includes('close')?'close':'established');
            return `<tr>
                <td>${esc(c.process)}</td>
                <td>${esc(c.local)}</td>
                <td>${esc(c.remote)}</td>
                <td><span class="conn-status ${cls}">${esc(c.status)}</span></td>
            </tr>`;
        }).join('');
    }

    window.addEventListener('load', () => {
        loadStats();
        loadRules();
        loadBlockedProcesses();
        loadConnections();
        setInterval(loadConnections, 5000);
    });
</script>

    <!-- 移动端导航：汉堡按钮 + 遮罩 -->
    <button class="nav-toggle" id="navToggle" aria-label="打开导航" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-overlay" id="navOverlay"></div>
    <script>
    // 移动端汉堡菜单切换：点击按钮展开/收起侧栏，遮罩或 Esc 关闭
    (function () {
        var btn = document.getElementById('navToggle');
        var overlay = document.getElementById('navOverlay');
        var sidebar = document.querySelector('.sidebar');
        if (!btn || !sidebar) return;
        function setOpen(open) {
            sidebar.classList.toggle('open', open);
            if (overlay) overlay.classList.toggle('show', open);
            btn.setAttribute('aria-expanded', String(open));
        }
        btn.addEventListener('click', function () { setOpen(!sidebar.classList.contains('open')); });
        if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
    </script>
</body>
</html>
