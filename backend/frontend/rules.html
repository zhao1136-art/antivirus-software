<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义规则 - 御天</title><script>(function(){try{var s=JSON.parse(localStorage.getItem('御天_settings')||'{}');if(s.theme==='light')document.documentElement.classList.add('light');}catch(e){}}())</script>
    <style>
        :root{--bg-primary:#0a1f2e;--bg-secondary:#0e0e14;--bg-card:#13131c;--bg-hover:#1a1a26;--border:#252536;--border-light:#2f2f44;--text-primary:#f4f4f9;--text-secondary:#8f8fab;--text-muted:#5c5c75;--accent:#00bcd4;--accent-dim:rgba(0,188,212,0.12);--accent-glow:rgba(0,188,212,0.35);--danger:#ff4d6d;--danger-dim:rgba(255,77,109,0.12);--warning:#ffcc00;--success:#00bcd4;--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.06) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.05) 0%,transparent 40%),linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px;pointer-events:none;z-index:0}
        .app{display:flex;min-height:100vh;position:relative;z-index:1}
        .sidebar{width:72px;background:rgba(14,14,20,0.85);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 8px;position:fixed;height:100vh;z-index:100}
        .logo{display:flex;flex-direction:column;align-items:center;gap:0;padding:0;margin-bottom:24px}
        .logo-icon{width:40px;height:40px;border-radius:12px;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,188,212,0.25)}
        .logo-icon img{width:100%;height:100%;object-fit:cover}
        .logo-text{display:none}
        .nav{display:flex;flex-direction:column;align-items:center;width:100%;gap:6px;flex:1}
        .nav-item{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:12px;color:var(--text-secondary);text-decoration:none;font-size:0;font-weight:500;transition:var(--transition);cursor:pointer;border:1px solid transparent;position:relative}
        .nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
        .nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,188,212,0.2)}
        .nav-item svg{width:22px;height:22px;opacity:0.85}
        .nav-item.active svg{opacity:1}
        .nav-item[href="settings.html"]{margin-top:auto}
        .nav-badge{position:absolute;top:0;right:-2px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;border-radius:10px;border:2px solid var(--bg-primary);line-height:1.4}
        .nav-group{width:100%;text-align:center;padding:14px 0 6px;font-size:0;user-select:none;position:relative}.nav-group::before{content:'';display:block;width:20px;height:1px;background:var(--border);margin:0 auto}
        .main{flex:1;margin-left:72px;padding:32px 40px;max-width:calc(100% - 72px)}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
        .header-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:700}
        .header-meta{display:flex;align-items:center;gap:20px}
        .time{color:var(--text-secondary);font-size:13px;font-family:'Syne',sans-serif;font-weight:500}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;transition:var(--transition);margin-bottom:24px}
        .card:hover{border-color:var(--border-light)}
        .card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:24px}
        .card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .card-desc{font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:var(--transition);white-space:nowrap}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#00b4a6);color:#000;box-shadow:0 4px 16px var(--accent-glow)}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
        .btn-danger{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,77,109,0.2)}
        .btn-danger:hover{background:var(--danger);color:#fff}
        .btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
        .btn-outline:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-light)}
        .btn-sm{padding:6px 14px;font-size:12px}
        .status-tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px}
        .status-tag.ok{background:var(--accent-dim);color:var(--accent)}
        .status-tag.fail{background:var(--danger-dim);color:var(--danger)}
        .status-tag.warn{background:rgba(255,204,0,0.1);color:var(--warning)}
        .stat-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-hover);border-radius:20px;font-size:12px;font-weight:600;color:var(--text-secondary)}
        .stat-chip svg{width:14px;height:14px}
        .input-text{padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:var(--transition);flex:1;min-width:200px}
        .input-text:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
        .input-text::placeholder{color:var(--text-muted)}
        select.input-text{appearance:none;cursor:pointer}
        textarea.input-text{min-height:80px;resize:vertical;font-family:'DM Sans',sans-serif;line-height:1.5}
        .data-table{width:100%;border-collapse:collapse;font-size:13px}
        .data-table th{text-align:left;padding:10px 12px;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
        .data-table td{padding:12px;border-bottom:1px solid var(--border);color:var(--text-primary)}
        .data-table tr:hover td{background:var(--bg-hover)}
        .data-table tr:last-child td{border-bottom:none}
        .empty-row{text-align:center;color:var(--text-muted);padding:24px;font-style:italic}
        .table-wrap{overflow-x:auto}
        .action-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;text-transform:uppercase}
        .action-tag.allow{background:var(--accent-dim);color:var(--accent)}
        .action-tag.block{background:var(--danger-dim);color:var(--danger)}
        .action-tag.alert{background:rgba(255,204,0,0.1);color:var(--warning)}
        .type-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--bg-hover);color:var(--text-secondary)}
        .toggle{width:44px;height:24px;background:var(--bg-hover);border-radius:20px;position:relative;cursor:pointer;transition:var(--transition);border:1px solid var(--border-light);flex-shrink:0;display:inline-block}
        .toggle.active{background:var(--accent);border-color:var(--accent)}
        .toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:white;border-radius:50%;transition:var(--transition);box-shadow:0 2px 6px rgba(0,0,0,0.2)}
        .toggle.active::after{transform:translateX(20px)}
        .template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
        .template-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;cursor:pointer;transition:var(--transition)}
        .template-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,188,212,0.12)}
        .template-card .tpl-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
        .template-card .tpl-desc{font-size:12px;color:var(--text-muted);line-height:1.5}
        .template-card .tpl-meta{font-size:11px;color:var(--accent);margin-top:8px;font-weight:600}
        /* 对话框 */
        .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:500}
        .modal-mask.show{display:flex}
        .modal{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:32px;width:min(520px,92vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
        .modal-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:24px}
        .modal-field{margin-bottom:16px}
        .modal-field label{display:block;font-size:12px;color:var(--text-secondary);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
        .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
        .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        html.light{--bg-primary:#f5f5f8;--bg-secondary:#eeeef3;--bg-card:#ffffff;--bg-hover:#e8e8f0;--border:#d8d8e4;--border-light:#c8c8d4;--text-primary:#1a1a2e;--text-secondary:#5a5a6e;--text-muted:#8a8a9e}
        html.light body::before{background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.04) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.03) 0%,transparent 40%),linear-gradient(rgba(0,0,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.02) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px}
        html.light .sidebar{background:rgba(255,255,255,0.85)}
        @media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;max-width:100%;padding:24px}}
        .nav-item:hover::after{content:attr(data-title);position:absolute;left:100%;margin-left:14px;background:var(--bg-card);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;z-index:300;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.4)}.nav-item.active:hover::after{border-color:rgba(0,188,212,0.3);color:var(--accent)}
    </style>
    <style>
        /* ---------- 统一导航增强：Logo / 移动端汉堡菜单 ---------- */
        .logo { padding: 0; margin-bottom: 22px; }
        .logo-icon { color: var(--accent); }
        .logo-icon svg { width: 26px; height: 26px; }
        .nav-toggle {
            display: none; position: fixed; top: 14px; left: 14px; z-index: 200;
            width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
            align-items: center; justify-content: center;
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-primary); box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .nav-toggle svg { width: 20px; height: 20px; }
        .nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 150; }
        .nav-overlay.show { display: block; }
        @media (max-width: 768px) {
            .nav-toggle { display: flex; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
            .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.4); }
            .main { margin-left: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

    <main class="main">
        <header class="header">
            <h1 class="header-title">自定义规则</h1>
            <div class="header-meta"><span class="time" id="clock">--:--</span></div>
        </header>

        <!-- 工具栏 -->
        <div class="card">
            <div class="toolbar">
                <div class="form-row">
                    <span class="stat-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>规则数: <strong id="ruleCount">0</strong></span>
                </div>
                <div class="form-row">
                    <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 添加规则</button>
                    <button class="btn btn-outline btn-sm" onclick="importRules()">导入</button>
                    <button class="btn btn-outline btn-sm" onclick="exportRules()">导出</button>
                    <button class="btn btn-outline btn-sm" onclick="loadRules()">刷新</button>
                </div>
            </div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>类型</th><th>动作</th><th>模式</th><th>描述</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody id="rulesBody"><tr><td colspan="6" class="empty-row">暂无规则</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- 规则模板 -->
        <div class="card">
            <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>规则模板快选</h3>
            <p class="card-desc">点击模板卡片即可快速添加常用规则</p>
            <div class="template-grid" id="templateGrid"></div>
        </div>
    </main>
</div>

<!-- 添加规则对话框 -->
<div class="modal-mask" id="addModal">
    <div class="modal">
        <h3 class="modal-title">添加自定义规则</h3>
        <div class="modal-field">
            <label>规则类型</label>
            <select class="input-text" id="mType" style="width:100%">
                <option value="file">文件 (file)</option>
                <option value="process">进程 (process)</option>
                <option value="registry">注册表 (registry)</option>
                <option value="network">网络 (network)</option>
                <option value="script">脚本 (script)</option>
            </select>
        </div>
        <div class="modal-field">
            <label>匹配模式</label>
            <input type="text" class="input-text" id="mPattern" placeholder="例如 *.exe / HKEY_*/Run / 192.168.*" style="width:100%">
        </div>
        <div class="modal-field">
            <label>动作</label>
            <select class="input-text" id="mAction" style="width:100%">
                <option value="block">阻止 (block)</option>
                <option value="allow">允许 (allow)</option>
                <option value="alert">告警 (alert)</option>
            </select>
        </div>
        <div class="modal-field">
            <label>描述（可选）</label>
            <textarea class="input-text" id="mDesc" placeholder="对该规则的简要说明" style="width:100%"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeAddModal()">取消</button>
            <button class="btn btn-primary" onclick="submitRule()">确认添加</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = ''; // 动态适配当前 origin

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent =
            String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
    updateClock();
    setInterval(updateClock, 1000);

    (function() {
        try {
            var q = JSON.parse(localStorage.getItem('御天_quarantine') || '[]');
            var el = document.getElementById('quarantineBadge');
            if (el) el.textContent = q.length || '0';
        } catch(e) {}
    })();

    async function apiGet(path) {
        try { const r = await fetch(API_BASE + path); return await r.json(); }
        catch(e) { console.warn(e); return null; }
    }
    async function apiPost(path, body) {
        try {
            const r = await fetch(API_BASE + path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
            return await r.json();
        } catch(e) { console.warn(e); return null; }
    }
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

    const TEMPLATES = [
        { name:'阻止可执行文件', type:'file', pattern:'*.scr', action:'block', desc:'阻止屏幕保护程序脚本运行' },
        { name:'监控启动项', type:'registry', pattern:'HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\*', action:'alert', desc:'监控用户启动项被修改' },
        { name:'阻止可疑进程', type:'process', pattern:'powershell.exe -enc *', action:'block', desc:'阻止 PowerShell 编码执行' },
        { name:'拦截可疑外联', type:'network', pattern:'*.onion', action:'block', desc:'阻止访问洋葱路由域名' },
        { name:'监控脚本执行', type:'script', pattern:'*.vbs', action:'alert', desc:'VBS 脚本执行时告警' },
        { name:'阻止宏文档', type:'file', pattern:'*.docm', action:'alert', desc:'带宏的 Word 文档打开时告警' },
        { name:'阻止挖矿连接', type:'network', pattern:'*:3333', action:'block', desc:'拦截常见挖矿矿池端口' },
        { name:'监控 Hosts 修改', type:'file', pattern:'C:\\Windows\\System32\\drivers\\etc\\hosts', action:'alert', desc:'Hosts 文件被修改时告警' }
    ];

    function renderTemplates() {
        const grid = document.getElementById('templateGrid');
        grid.innerHTML = TEMPLATES.map((t,i)=>`<div class="template-card" onclick='addFromTemplate(${i})'>
            <div class="tpl-name">${esc(t.name)}</div>
            <div class="tpl-desc">${esc(t.desc)}</div>
            <div class="tpl-meta">${esc(t.type)} · ${esc(t.action)} · ${esc(t.pattern)}</div>
        </div>`).join('');
    }

    function addFromTemplate(i) {
        const t = TEMPLATES[i];
        apiPost('/api/v1/rules/add', { rule_type:t.type, pattern:t.pattern, action:t.action, description:t.desc, enabled:true }).then(r=>{
            if (r) loadRules();
        });
    }

    // 规则列表
    async function loadRules() {
        const data = await apiGet('/api/v1/rules/list');
        const body = document.getElementById('rulesBody');
        const rules = (data && data.rules) || [];
        document.getElementById('ruleCount').textContent = rules.length;
        if (!rules.length) { body.innerHTML = '<tr><td colspan="6" class="empty-row">暂无规则</td></tr>'; return; }
        body.innerHTML = rules.map((r,i)=>`<tr>
            <td><span class="type-tag">${esc(r.type)}</span></td>
            <td><span class="action-tag ${r.action==='allow'?'allow':(r.action==='alert'?'alert':'block')}">${esc(r.action)}</span></td>
            <td style="font-family:'Courier New',monospace;font-size:12px">${esc(r.pattern)}</td>
            <td>${esc(r.description||'—')}</td>
            <td><span class="toggle ${r.enabled===false?'':'active'}" onclick="toggleRule(${i},'${esc(r.id||'')}')"></span></td>
            <td><button class="btn btn-danger btn-sm" onclick="delRule(${i},'${esc(r.id||'')}')">删除</button></td>
        </tr>`).join('');
    }

    async function toggleRule(idx, id) {
        const el = document.querySelectorAll('#rulesBody .toggle')[idx];
        const newEnabled = !(el && el.classList.contains('active'));
        const r = await apiPost('/api/v1/rules/toggle', { rule_id: id, enabled: newEnabled });
        if (r) loadRules();
    }
    async function delRule(idx, id) {
        if (!confirm('确认删除该规则？')) return;
        const r = await apiPost('/api/v1/rules/remove', { rule_id: id });
        if (r) loadRules();
    }

    // 添加对话框
    function openAddModal() {
        document.getElementById('addModal').classList.add('show');
        document.getElementById('mType').value = 'file';
        document.getElementById('mPattern').value = '';
        document.getElementById('mAction').value = 'block';
        document.getElementById('mDesc').value = '';
    }
    function closeAddModal() {
        document.getElementById('addModal').classList.remove('show');
    }
    async function submitRule() {
        const body = {
            rule_type: document.getElementById('mType').value,
            pattern: document.getElementById('mPattern').value.trim(),
            action: document.getElementById('mAction').value,
            description: document.getElementById('mDesc').value.trim(),
            enabled: true
        };
        if (!body.pattern) { alert('请输入匹配模式'); return; }
        const r = await apiPost('/api/v1/rules/add', body);
        if (r) { closeAddModal(); loadRules(); }
    }

    // 导入/导出
    async function exportRules() {
        const data = await apiGet('/api/v1/rules/export');
        const rules = (data && data.rules) || [];
        const blob = new Blob([JSON.stringify(rules, null, 2)], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'rules_export.json'; a.click();
        URL.revokeObjectURL(url);
    }
    function importRules() {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = '.json';
        inp.onchange = async () => {
            const f = inp.files[0]; if (!f) return;
            try {
                const text = await f.text();
                const arr = JSON.parse(text);
                if (!Array.isArray(arr)) { alert('文件格式错误'); return; }
                const r = await apiPost('/api/v1/rules/import', { rules: arr });
                if (r) loadRules();
            } catch(e) { alert('导入失败：' + e.message); }
        };
        inp.click();
    }

    window.addEventListener('load', () => {
        renderTemplates();
        loadRules();
    });
</script>

    <!-- 移动端导航：汉堡按钮 + 遮罩 -->
    <button class="nav-toggle" id="navToggle" aria-label="打开导航" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-overlay" id="navOverlay"></div>
    <script>
    // 移动端汉堡菜单切换：点击按钮展开/收起侧栏，遮罩或 Esc 关闭
    (function () {
        var btn = document.getElementById('navToggle');
        var overlay = document.getElementById('navOverlay');
        var sidebar = document.querySelector('.sidebar');
        if (!btn || !sidebar) return;
        function setOpen(open) {
            sidebar.classList.toggle('open', open);
            if (overlay) overlay.classList.toggle('show', open);
            btn.setAttribute('aria-expanded', String(open));
        }
        btn.addEventListener('click', function () { setOpen(!sidebar.classList.contains('open')); });
        if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
    </script>
</body>
</html>
