<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐私保护 - 御天</title><script>(function(){try{var s=JSON.parse(localStorage.getItem('御天_settings')||'{}');if(s.theme==='light')document.documentElement.classList.add('light');}catch(e){}}())</script>
    <style>
        :root{--bg-primary:#0a1f2e;--bg-secondary:#0e0e14;--bg-card:#13131c;--bg-hover:#1a1a26;--border:#252536;--border-light:#2f2f44;--text-primary:#f4f4f9;--text-secondary:#8f8fab;--text-muted:#5c5c75;--accent:#00bcd4;--accent-dim:rgba(0,188,212,0.12);--accent-glow:rgba(0,188,212,0.35);--danger:#ff4d6d;--danger-dim:rgba(255,77,109,0.12);--warning:#ffcc00;--success:#00bcd4;--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.06) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.05) 0%,transparent 40%),linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px;pointer-events:none;z-index:0}
        .app{display:flex;min-height:100vh;position:relative;z-index:1}
        .sidebar{width:72px;background:rgba(14,14,20,0.85);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 8px;position:fixed;height:100vh;z-index:100}
        .logo{display:flex;flex-direction:column;align-items:center;gap:0;padding:0;margin-bottom:24px}
        .logo-icon{width:40px;height:40px;border-radius:12px;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,188,212,0.25)}
        .logo-icon img{width:100%;height:100%;object-fit:cover}
        .logo-text{display:none}
        .nav{display:flex;flex-direction:column;align-items:center;width:100%;gap:6px;flex:1}
        .nav-item{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:12px;color:var(--text-secondary);text-decoration:none;font-size:0;font-weight:500;transition:var(--transition);cursor:pointer;border:1px solid transparent;position:relative}
        .nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
        .nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,188,212,0.2)}
        .nav-item svg{width:22px;height:22px;opacity:0.85}
        .nav-item.active svg{opacity:1}
        .nav-item[href="settings.html"]{margin-top:auto}
        .nav-badge{position:absolute;top:0;right:-2px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;border-radius:10px;border:2px solid var(--bg-primary);line-height:1.4}
        .nav-group{width:100%;text-align:center;padding:14px 0 6px;font-size:0;user-select:none;position:relative}.nav-group::before{content:'';display:block;width:20px;height:1px;background:var(--border);margin:0 auto}
        .main{flex:1;margin-left:72px;padding:32px 40px;max-width:calc(100% - 72px)}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
        .header-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:700}
        .header-meta{display:flex;align-items:center;gap:20px}
        .time{color:var(--text-secondary);font-size:13px;font-family:'Syne',sans-serif;font-weight:500}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;transition:var(--transition);margin-bottom:24px}
        .card:hover{border-color:var(--border-light)}
        .card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:24px}
        .card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .card-desc{font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:var(--transition);white-space:nowrap}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#00b4a6);color:#000;box-shadow:0 4px 16px var(--accent-glow)}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
        .btn-danger{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,77,109,0.2)}
        .btn-danger:hover{background:var(--danger);color:#fff}
        .btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
        .btn-outline:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-light)}
        .btn-sm{padding:6px 14px;font-size:12px}
        .toggle{width:48px;height:26px;background:var(--bg-hover);border-radius:20px;position:relative;cursor:pointer;transition:var(--transition);border:1px solid var(--border-light);flex-shrink:0}
        .toggle.active{background:var(--accent);border-color:var(--accent)}
        .toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:white;border-radius:50%;transition:var(--transition);box-shadow:0 2px 6px rgba(0,0,0,0.2)}
        .toggle.active::after{transform:translateX(22px)}
        .status-tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px}
        .status-tag.ok{background:var(--accent-dim);color:var(--accent)}
        .status-tag.fail{background:var(--danger-dim);color:var(--danger)}
        .status-tag.warn{background:rgba(255,204,0,0.1);color:var(--warning)}
        .stat-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-hover);border-radius:20px;font-size:12px;font-weight:600;color:var(--text-secondary)}
        .stat-chip svg{width:14px;height:14px}
        .input-text{padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:var(--transition);flex:1;min-width:200px}
        .input-text:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
        .input-text::placeholder{color:var(--text-muted)}
        .data-table{width:100%;border-collapse:collapse;font-size:13px}
        .data-table th{text-align:left;padding:10px 12px;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
        .data-table td{padding:12px;border-bottom:1px solid var(--border);color:var(--text-primary)}
        .data-table tr:hover td{background:var(--bg-hover)}
        .data-table tr:last-child td{border-bottom:none}
        .empty-row{text-align:center;color:var(--text-muted);padding:24px;font-style:italic}
        .table-wrap{overflow-x:auto}
        .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
        /* 隐私分类卡片 */
        .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
        .cat-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;transition:var(--transition)}
        .cat-card:hover{border-color:var(--border-light);transform:translateY(-2px)}
        .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .cat-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-dim);display:grid;place-items:center;flex-shrink:0}
        .cat-icon svg{width:18px;height:18px;color:var(--accent)}
        .cat-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:600}
        .cat-count{font-size:24px;font-family:'Syne',sans-serif;font-weight:700;color:var(--accent);line-height:1}
        .cat-count .unit{font-size:12px;color:var(--text-muted);font-weight:500;margin-left:4px}
        .cat-meta{font-size:11px;color:var(--text-muted);margin-top:4px}
        .cat-actions{margin-top:12px;display:flex;gap:8px}
        .cat-card.scanned .cat-count{color:var(--warning)}
        .cat-card.empty .cat-count{color:var(--text-muted)}
        /* 敏感文件列表 */
        .file-list{list-style:none;padding:0}
        .file-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13px}
        .file-item .path{font-family:'Courier New',monospace;font-size:12px;color:var(--text-primary);word-break:break-all;flex:1}
        .file-item .remove{cursor:pointer;color:var(--danger);font-weight:700;font-size:16px;line-height:1;margin-left:10px;flex-shrink:0}
        .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        html.light{--bg-primary:#f5f5f8;--bg-secondary:#eeeef3;--bg-card:#ffffff;--bg-hover:#e8e8f0;--border:#d8d8e4;--border-light:#c8c8d4;--text-primary:#1a1a2e;--text-secondary:#5a5a6e;--text-muted:#8a8a9e}
        html.light body::before{background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.04) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.03) 0%,transparent 40%),linear-gradient(rgba(0,0,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.02) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px}
        html.light .sidebar{background:rgba(255,255,255,0.85)}
        @media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;max-width:100%;padding:24px}}
        .nav-item:hover::after{content:attr(data-title);position:absolute;left:100%;margin-left:14px;background:var(--bg-card);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;z-index:300;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.4)}.nav-item.active:hover::after{border-color:rgba(0,188,212,0.3);color:var(--accent)}
    </style>
    <style>
        /* ---------- 统一导航增强：Logo / 移动端汉堡菜单 ---------- */
        .logo { padding: 0; margin-bottom: 22px; }
        .logo-icon { color: var(--accent); }
        .logo-icon svg { width: 26px; height: 26px; }
        .nav-toggle {
            display: none; position: fixed; top: 14px; left: 14px; z-index: 200;
            width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
            align-items: center; justify-content: center;
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-primary); box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .nav-toggle svg { width: 20px; height: 20px; }
        .nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 150; }
        .nav-overlay.show { display: block; }
        @media (max-width: 768px) {
            .nav-toggle { display: flex; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
            .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.4); }
            .main { margin-left: 0; max-width: 100%; }
        }
    </style>
</head>
<body>
<div class="app">

            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
            </div>

        <nav class="nav">

            <a class="nav-item" href="guard.html" data-title="卫士体检"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>卫士体检</a>

            <a class="nav-item" href="optimize.html" data-title="电脑优化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>电脑优化</a>

    <main class="main">
        <header class="header">
            <h1 class="header-title">隐私保护</h1>
            <div class="header-meta"><span class="time" id="clock">--:--</span></div>
        </header>

        <!-- 总开关 -->
        <div class="card">
            <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>隐私保护总开关</h3>
            <p class="card-desc">开启后将自动监控敏感文件访问、定期清理隐私痕迹</p>
            <div class="card-row">
                <span>隐私保护</span>
                <div class="toggle" id="togglePrivacy" onclick="togglePrivacy()"></div>
            </div>
            <div class="card-row">
                <span class="stat-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>状态: <strong id="privacyStatus">未启用</strong></span>
                <span class="stat-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>上次清理: <strong id="lastClean">—</strong></span>
            </div>
        </div>

        <!-- 隐私痕迹扫描 -->
        <div class="card">
            <div class="toolbar">
                <h3 class="card-title" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>隐私痕迹扫描</h3>
                <div class="form-row" style="margin-bottom:0">
                    <button class="btn btn-primary btn-sm" onclick="scanAll()">扫描全部</button>
                    <button class="btn btn-danger btn-sm" onclick="cleanAll()">一键清理</button>
                </div>
            </div>
            <p class="card-desc">扫描系统中可被他人恢复的隐私痕迹，按分类清理</p>
            <div class="cat-grid" id="catGrid"></div>
        </div>

        <!-- 敏感文件保护 -->
        <div class="card">
            <div class="toolbar">
                <h3 class="card-title" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>敏感文件保护</h3>
                <button class="btn btn-outline btn-sm" onclick="loadSensitiveFiles()">刷新</button>
            </div>
            <p class="card-desc">添加到列表的文件被任何程序访问时将记录日志并告警</p>
            <div class="form-row">
                <input type="text" class="input-text" id="sensitiveInput" placeholder="文件路径，例如 D:\私密\财务.xlsx">
                <button class="btn btn-primary btn-sm" onclick="addSensitiveFile()">添加保护</button>
            </div>
            <ul class="file-list" id="sensitiveList"><li class="empty-row">暂无保护的敏感文件</li></ul>
        </div>

        <!-- 敏感文件访问日志 -->
        <div class="card">
            <div class="toolbar">
                <h3 class="card-title" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>敏感文件访问日志</h3>
                <button class="btn btn-outline btn-sm" onclick="loadAccessLogs()">刷新</button>
            </div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>时间</th><th>文件</th><th>访问进程</th><th>操作</th><th>结果</th></tr></thead>
                    <tbody id="logBody"><tr><td colspan="5" class="empty-row">暂无访问记录</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    const API_BASE = ''; // 动态适配当前 origin

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent =
            String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
    updateClock();
    setInterval(updateClock, 1000);

    (function() {
        try {
            var q = JSON.parse(localStorage.getItem('御天_quarantine') || '[]');
            var el = document.getElementById('quarantineBadge');
            if (el) el.textContent = q.length || '0';
        } catch(e) {}
    })();

    async function apiGet(path) {
        try { const r = await fetch(API_BASE + path); return await r.json(); }
        catch(e) { console.warn(e); return null; }
    }
    async function apiPost(path, body) {
        try {
            const r = await fetch(API_BASE + path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
            return await r.json();
        } catch(e) { console.warn(e); return null; }
    }
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

    // 分类定义
    const CATEGORIES = [
        { key:'browser_history', name:'浏览器历史', icon:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' },
        { key:'cookies',         name:'Cookie',     icon:'<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>' },
        { key:'cache',           name:'缓存',       icon:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>' },
        { key:'recent_docs',     name:'最近文档',   icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>' },
        { key:'temp_files',      name:'临时文件',   icon:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>' },
        { key:'recycle_bin',     name:'回收站',     icon:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' },
        { key:'clipboard',       name:'剪贴板',     icon:'<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>' }
    ];

    let scanResults = {};

    function renderCategories() {
        const grid = document.getElementById('catGrid');
        grid.innerHTML = CATEGORIES.map(c=>{
            const r = scanResults[c.key];
            const count = r ? (r.count || 0) : null;
            const sizeStr = r && r.size ? ' · ' + formatSize(r.size) : '';
            const cls = r ? (count>0 ? 'scanned' : 'empty') : '';
            const countHtml = count===null
                ? '<span style="font-size:13px;color:var(--text-muted)">未扫描</span>'
                : `${count}<span class="unit">项${sizeStr}</span>`;
            return `<div class="cat-card ${cls}">
                <div class="cat-head">
                    <div class="cat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${c.icon}</svg></div>
                    <div class="cat-name">${c.name}</div>
                </div>
                <div class="cat-count">${countHtml}</div>
                <div class="cat-meta">${r && r.detail ? esc(r.detail) : (count!==null && count===0 ? '已是干净状态' : '点击扫描查看详情')}</div>
                <div class="cat-actions">
                    <button class="btn btn-outline btn-sm" onclick="scanCategory('${c.key}')">扫描</button>
                    <button class="btn btn-danger btn-sm" onclick="cleanCategory('${c.key}')" ${count===null||count===0?'disabled':''}>清理</button>
                </div>
            </div>`;
        }).join('');
    }

    function formatSize(bytes) {
        if (!bytes) return '0 B';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
        return (bytes/1024/1024).toFixed(1) + ' MB';
    }

    // 总开关
    async function togglePrivacy() {
        const el = document.getElementById('togglePrivacy');
        const newState = !el.classList.contains('active');
        el.classList.toggle('active', newState);
        const data = await apiPost('/api/v1/privacy/toggle', { module:'privacy', enabled:newState });
        if (data) { el.classList.toggle('active', !!data.enabled); updatePrivacyStatus(data.enabled); }
        else { updatePrivacyStatus(newState); }
    }
    function updatePrivacyStatus(en){document.getElementById('privacyStatus').textContent = en ? '已启用' : '未启用';}

    async function loadStatus() {
        const data = await apiGet('/api/v1/privacy/status');
        if (!data) return;
        const el = document.getElementById('togglePrivacy');
        el.classList.toggle('active', !!data.enabled);
        updatePrivacyStatus(!!data.enabled);
        if (data.last_clean) document.getElementById('lastClean').textContent = data.last_clean;
    }

    // 扫描
    async function scanCategory(key) {
        const data = await apiPost('/api/v1/privacy/scan', { category:key });
        if (data) { scanResults[key] = data; renderCategories(); }
    }
    async function scanAll() {
        const data = await apiPost('/api/v1/privacy/scan', { category:'all' });
        if (data && data.results) {
            scanResults = Object.assign({}, data.results);
        } else if (data) {
            // 单个返回时合并
            CATEGORIES.forEach(c=>{ if (data[c.key]) scanResults[c.key] = data[c.key]; });
        }
        renderCategories();
    }

    // 清理
    async function cleanCategory(key) {
        if (!confirm('确认清理 ' + (CATEGORIES.find(c=>c.key===key)||{}).name + '？此操作不可撤销。')) return;
        const data = await apiPost('/api/v1/privacy/clean', { category:key });
        if (data) { scanResults[key] = { count:0, size:0, detail:'已清理' }; renderCategories(); loadStatus(); }
    }
    async function cleanAll() {
        if (!confirm('确认清理所有隐私痕迹？此操作不可撤销。')) return;
        const data = await apiPost('/api/v1/privacy/clean', { category:'all' });
        if (data) {
            CATEGORIES.forEach(c=>{ scanResults[c.key] = { count:0, size:0, detail:'已清理' }; });
            renderCategories();
            loadStatus();
        }
    }

    // 敏感文件
    async function loadSensitiveFiles() {
        const data = await apiGet('/api/v1/privacy/sensitive-files');
        const list = document.getElementById('sensitiveList');
        const files = (data && (data.files || data.list)) || [];
        if (!files.length) { list.innerHTML = '<li class="empty-row">暂无保护的敏感文件</li>'; return; }
        list.innerHTML = files.map((f,i)=>`<li class="file-item">
            <span class="path">${esc(f.path||f)}</span>
            <span class="remove" onclick="removeSensitiveFile(${i},'${esc(f.id||f.path||f)}')">×</span>
        </li>`).join('');
    }
    async function addSensitiveFile() {
        const path = document.getElementById('sensitiveInput').value.trim();
        if (!path) { alert('请输入文件路径'); return; }
        const r = await apiPost('/api/v1/privacy/sensitive-files', { path:path });
        if (r) { document.getElementById('sensitiveInput').value=''; loadSensitiveFiles(); }
    }
    async function removeSensitiveFile(idx, id) {
        const r = await apiPost('/api/v1/privacy/sensitive-files/delete', { index:idx, id:id });
        if (r) loadSensitiveFiles();
    }

    // 访问日志
    async function loadAccessLogs() {
        const data = await apiGet('/api/v1/privacy/access-log');
        const body = document.getElementById('logBody');
        const logs = (data && (data.logs || data.list)) || [];
        if (!logs.length) { body.innerHTML = '<tr><td colspan="5" class="empty-row">暂无访问记录</td></tr>'; return; }
        body.innerHTML = logs.map(l=>`<tr>
            <td>${esc(l.time||'—')}</td>
            <td style="font-family:'Courier New',monospace;font-size:12px">${esc(l.file||l.path||'—')}</td>
            <td>${esc(l.process||'—')}</td>
            <td>${esc(l.operation||l.action||'—')}</td>
            <td><span class="status-tag ${l.blocked?'fail':'ok'}">${l.blocked?'已阻止':'已记录'}</span></td>
        </tr>`).join('');
    }

    window.addEventListener('load', () => {
        renderCategories();
        loadStatus();
        loadSensitiveFiles();
        loadAccessLogs();
    });
</script>

    <!-- 移动端导航：汉堡按钮 + 遮罩 -->
    <button class="nav-toggle" id="navToggle" aria-label="打开导航" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-overlay" id="navOverlay"></div>
    <script>
    // 移动端汉堡菜单切换：点击按钮展开/收起侧栏，遮罩或 Esc 关闭
    (function () {
        var btn = document.getElementById('navToggle');
        var overlay = document.getElementById('navOverlay');
        var sidebar = document.querySelector('.sidebar');
        if (!btn || !sidebar) return;
        function setOpen(open) {
            sidebar.classList.toggle('open', open);
            if (overlay) overlay.classList.toggle('show', open);
            btn.setAttribute('aria-expanded', String(open));
        }
        btn.addEventListener('click', function () { setOpen(!sidebar.classList.contains('open')); });
        if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
    </script>
    <script src="/static/decision_popup.js"></script>
</body>
</html>
