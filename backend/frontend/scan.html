<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安盾 - 病毒扫描</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var s=JSON.parse(localStorage.getItem('安盾_settings')||'{}');if(s.theme==='light')document.documentElement.classList.add('light');}catch(e){}}())</script>
<style>
  :root {
    --bg-primary: #0a0a12;
    --bg-secondary: #111120;
    --bg-card: #16162a;
    --bg-hover: #1e1e3a;
    --border: #2a2a45;
    --border-light: #3a3a55;
    --text-primary: #f0f0f8;
    --text-secondary: #a0a0be;
    --text-muted: #6a6a88;
    --accent: #3b82f6;
    --accent-dim: rgba(59, 130, 246, 0.12);
    --accent-glow: rgba(59, 130, 246, 0.30);
    --danger: #ef4444;
    --danger-dim: rgba(239, 68, 68, 0.12);
    --warning: #ffcc00;
    --warning-dim: rgba(255, 204, 0, 0.12);
    --success: #22c55e;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 240px;
    min-width: 240px;
    height: 100vh;
    position: fixed;
    left: 0; top: 0;
    background: rgba(14, 14, 20, 0.85);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 18px;
    z-index: 100;
    overflow-y: auto;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 10px;
    margin-bottom: 40px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px rgba(0, 217, 192, 0.25);
  }

  .logo-icon svg {
    width: 22px;
    height: 22px;
    fill: white;
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    cursor: pointer;
    border: 1px solid transparent;
  }

  .nav-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  .nav-item.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(0, 217, 192, 0.2);
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    opacity: 0.8;
  }

  .nav-badge {
    margin-left: auto;
    background: var(--danger-dim);
    color: var(--danger);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
  }

.nav-group {
  padding: 18px 14px 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  user-select: none;
}

.nav-group:first-child {
  padding-top: 0;
}


  /* ===== MAIN CONTENT ===== */
  .main-content {
    margin-left: 240px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .top-header {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-primary);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .top-header .page-title-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .top-header .page-title {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    background: var(--accent-dim);
    color: var(--accent);
  }

  .status-pill .pulse-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse-dot 1.4s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.6); }
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-actions .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    color: var(--text-secondary);
  }

  .header-actions .icon-btn:hover {
    background: rgba(255,255,255,0.04);
    border-color: var(--border-light);
    color: var(--text-primary);
  }

  .header-actions .icon-btn svg {
    width: 18px; height: 18px;
  }

  /* ===== PAGE CONTENT ===== */
  .page-content {
    flex: 1;
    padding: 32px 36px 40px;
    overflow-y: auto;
  }

  /* ===== SCAN CARDS GRID ===== */
  .scan-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 40px;
  }

  .scan-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }

  .scan-card:hover {
    background: var(--bg-hover);
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px var(--accent-glow);
  }

  .scan-card:active {
    transform: scale(0.97);
    transition: 0.08s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .scan-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at top right, var(--accent-dim), transparent 70%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .scan-card:hover::before {
    opacity: 1;
  }

  .scan-card .card-icon-wrap {
    width: 50px; height: 50px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }

  .scan-card:nth-child(1) .card-icon-wrap {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .scan-card:nth-child(2) .card-icon-wrap {
    background: var(--danger-dim);
    color: var(--danger);
  }

  .scan-card:nth-child(3) .card-icon-wrap {
    background: var(--warning-dim);
    color: var(--warning);
  }

  .scan-card:nth-child(1):hover .card-icon-wrap {
    background: var(--accent);
    color: #fff;
  }

  .scan-card:nth-child(2):hover .card-icon-wrap {
    background: var(--danger);
    color: #fff;
  }

  .scan-card:nth-child(3):hover .card-icon-wrap {
    background: var(--warning);
    color: #fff;
  }

  .scan-card .card-icon-wrap svg {
    width: 24px; height: 24px;
    transition: var(--transition);
  }

  .scan-card h3 {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text-primary);
  }

  .scan-card p {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .scan-card .scan-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: var(--transition);
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
    position: relative;
    z-index: 1;
  }

  .scan-card:hover .scan-btn {
    background: var(--accent);
    color: var(--bg-primary);
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .scan-card .scan-btn svg {
    width: 16px; height: 16px;
  }

  /* ===== SECTION HEADER ===== */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .section-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .section-header .clear-btn {
    padding: 7px 16px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 600;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    transition: var(--transition);
  }

  .section-header .clear-btn:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: var(--danger-dim);
  }

  /* ===== SCAN HISTORY TABLE ===== */
  .history-table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .history-table {
    width: 100%;
    border-collapse: collapse;
  }

  .history-table thead th {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    text-align: left;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.15);
  }

  .history-table tbody td {
    padding: 15px 22px;
    font-size: 13.5px;
    color: var(--text-primary);
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }

  .history-table tbody tr {
    transition: var(--transition);
  }

  .history-table tbody tr:hover {
    background: rgba(255,255,255,0.02);
  }

  .history-table tbody tr:last-child td {
    border-bottom: none;
  }

  .scan-type-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }

  .scan-type-badge.quick { background: var(--accent-dim); color: var(--accent); }
  .scan-type-badge.full { background: var(--danger-dim); color: var(--danger); }
  .scan-type-badge.custom { background: var(--warning-dim); color: var(--warning); }

  .history-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .history-status .dot { width: 7px; height: 7px; border-radius: 50%; }
  .history-status .dot.clean { background: var(--success); }
  .history-status .dot.threat { background: var(--danger); animation: pulse-dot 1.4s ease-in-out infinite; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    color: var(--text-muted);
    text-align: center;
  }

  .empty-state svg {
    width: 48px; height: 48px;
    margin-bottom: 14px;
    opacity: 0.4;
  }

  .empty-state p {
    font-size: 14px;
    font-weight: 500;
  }

  .empty-state span {
    font-size: 12px;
    margin-top: 4px;
    opacity: 0.7;
  }

  /* ===== SCAN OVERLAY ===== */
  .scan-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 20, 0.92);
    backdrop-filter: blur(12px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .scan-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .scan-overlay-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 48px 56px;
    text-align: center;
    max-width: 520px;
    width: 90%;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }

  .scan-overlay-card .close-overlay {
    position: absolute;
    top: 18px; right: 18px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-size: 16px;
  }

  .scan-overlay-card .close-overlay:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
  }

  .scan-overlay-card .radar-wrap {
    position: relative;
    width: 140px; height: 140px;
    margin: 0 auto 28px;
  }

  .radar-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--accent-dim);
    animation: radar-pulse 2s ease-in-out infinite;
  }

  .radar-ring:nth-child(2) { animation-delay: 0.6s; }
  .radar-ring:nth-child(3) { animation-delay: 1.2s; }

  @keyframes radar-pulse {
    0% { transform: scale(0.7); opacity: 0; }
    30% { opacity: 0.6; }
    60% { opacity: 0.15; }
    100% { transform: scale(1.15); opacity: 0; }
  }

  .radar-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 30px var(--accent-glow);
    z-index: 2;
  }

  .radar-sweep {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(0,217,192,0.2) 30deg, transparent 60deg);
    animation: radar-sweep 2.5s linear infinite;
    z-index: 1;
  }

  @keyframes radar-sweep {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .scan-overlay-card h3 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .scan-overlay-card .scan-status-text {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  .scan-overlay-card .progress-bar-wrap {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .scan-overlay-card .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #00f0d0);
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .scan-overlay-card .scan-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
  }

  .scan-overlay-card .scan-meta span {
    font-family: 'DM Sans', sans-serif;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1100px) {
    .scan-cards { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main-content { margin-left: 0; }
    .scan-cards { grid-template-columns: 1fr; }
    .top-header { padding: 0 20px; }
    .page-content { padding: 24px 20px 32px; }
    .scan-overlay-card { padding: 32px 24px; }
    .history-table thead { display: none; }
    .history-table tbody td {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .history-table tbody td::before {
      content: attr(data-label);
      font-weight: 600;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
    }
  }

  html.light {
    --bg-primary: #f5f5f8;
    --bg-secondary: #eeeef3;
    --bg-card: #ffffff;
    --bg-hover: #e8e8f0;
    --border: #d8d8e4;
    --border-light: #c8c8d4;
    --text-primary: #1a1a2e;
    --text-secondary: #5a5a6e;
    --text-muted: #8a8a9e;
  }
  html.light .sidebar { background: rgba(255, 255, 255, 0.85); }
</style>
</head>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    设置
                </a>
            </nav>
</aside>

<!-- ===== MAIN CONTENT ===== -->
<main class="main-content">
  <header class="top-header">
    <div class="page-title-group">
      <h1 class="page-title">病毒扫描</h1>
      <div class="status-pill">
        <span class="pulse-dot"></span>
        系统安全
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="page-content">
    <!-- Scan Cards -->
    <div class="scan-cards">
      <div class="scan-card" onclick="triggerScan('quick')">
        <div class="card-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>

          </svg>
        </div>
        <h3>快速扫描</h3>
        <p>扫描系统关键区域和内存中的活跃进程。<br><strong>预计耗时：约 5 分钟</strong></p>
        <button class="scan-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          开始快速扫描
        </button>
      </div>

      <div class="scan-card" onclick="triggerScan('full')">
        <div class="card-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <h3>完整扫描</h3>
        <p>深度扫描系统中的所有文件，确保全面检测。<br><strong>预计耗时：约 1 小时</strong></p>
        <button class="scan-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          开始完整扫描
        </button>
      </div>

      <div class="scan-card" onclick="openFolderDialog()">
        <div class="card-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
          </svg>
        </div>
        <h3>自定义扫描</h3>
        <p>选择特定的文件或文件夹进行针对性扫描，灵活高效。</p>
        <button class="scan-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
          选择文件夹

    </div>

    <!-- Scan History -->
    <div class="section-header">
      <h2>扫描历史</h2>
      <button class="clear-btn" onclick="clearHistory()">清除记录</button>

    <div class="history-table-wrap">
      <div id="history-container">

      </div>

</main>

<!-- ===== SCAN OVERLAY ===== -->
<div class="scan-overlay" id="scanOverlay">
  <div class="scan-overlay-card">
    <button class="close-overlay" onclick="closeScan()" title="取消扫描">✕</button>
    <div class="radar-wrap">
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-sweep"></div>
      <div class="radar-center"></div>
    </div>
    <h3 id="scanTitle">正在扫描...</h3>
    <p class="scan-status-text" id="scanStatusText">正在检查系统文件</p>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
    <div class="scan-meta">
      <span id="scanFilesChecked">已检查: 0 个文件</span>
      <span id="scanPercent">0%</span>
    </div>
    <div class="scan-meta" style="margin-top: 8px;">
      <span id="scanRemaining"></span>
    </div>
  </div>
</div>

<!-- ===== FOLDER PICKER DIALOG ===== -->
<div class="scan-overlay" id="folderDialog">
  <div class="scan-overlay-card" style="max-width:480px">
    <button class="close-overlay" onclick="closeFolderDialog()">✕</button>
    <h3 style="font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:16px;color:var(--text-primary)">自定义扫描</h3>
    <p style="color:var(--text-secondary);font-size:14px;margin-bottom:20px">输入要扫描的文件夹路径（多个路径用逗号分隔）</p>
    <input type="text" id="folderInput" placeholder="例如: C:\Users\Administrator\Downloads" 
           style="width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:20px;box-sizing:border-box"
           onkeydown="if(event.key==='Enter')startCustomScan()">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeFolderDialog()" style="padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif">取消</button>
      <button onclick="startCustomScan()" style="padding:10px 24px;border-radius:10px;border:none;background:var(--accent);color:#000;cursor:pointer;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif">开始扫描</button>
    </div>
  </div>
</div>

<script>
  (function() { try { var q = JSON.parse(localStorage.getItem('安盾_quarantine') || '[]'); document.getElementById('quarantineBadge').textContent = q.length || '0'; } catch(e) {} })();

  const API_BASE = ''; // 动态适配当前 origin
  const SCAN_LABELS = {
    quick: '快速扫描',
    full: '完整扫描',
    custom: '自定义扫描',
  };

  async function apiGet(path) {
    try { const res = await fetch(`${API_BASE}${path}`); return await res.json(); }
    catch (e) { console.warn('API 不可用:', e.message); return null; }
  }

  async function apiPost(path, body) {
    try {
      const res = await fetch(`${API_BASE}${path}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return await res.json();
    } catch (e) { console.warn('API 不可用:', e.message); return null; }
  }

  // ── Scan overlay ──
  let currentTaskId = null;
  let ws = null;
  let scanInterval = null;

  function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    try {
      ws = new WebSocket(`ws://${window.location.host}/ws/progress`);
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.task_id === currentTaskId) {
          document.getElementById('progressBarFill').style.width = `${msg.progress || 0}%`;
          document.getElementById('scanPercent').textContent = `${msg.progress || 0}%`;
          document.getElementById('scanStatusText').textContent = msg.current_file || '扫描中...';
        }
      };
      ws.onclose = () => { ws = null; };
    } catch (e) { ws = null; }
  }

  function formatTimeEstimate(seconds) {
    if (seconds <= 0) return '0 秒';
    if (seconds < 60) return seconds + ' 秒';
    if (seconds < 3600) return Math.floor(seconds / 60) + ' 分钟 ' + (seconds % 60) + ' 秒';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return m > 0 ? h + ' 小时 ' + m + ' 分钟' : h + ' 小时';
  }

  async function triggerScan(type, customPaths = null) {
    const overlay = document.getElementById('scanOverlay');
    const title = document.getElementById('scanTitle');
    const statusText = document.getElementById('scanStatusText');
    const bar = document.getElementById('progressBarFill');
    const filesChecked = document.getElementById('scanFilesChecked');
    const percent = document.getElementById('scanPercent');
    const remaining = document.getElementById('scanRemaining');

    title.textContent = SCAN_LABELS[type] + ' 进行中...';
    statusText.textContent = '正在连接扫描引擎...';
    bar.style.width = '0%';
    filesChecked.textContent = '已检查: 0 个文件';
    percent.textContent = '0%';
    remaining.textContent = '';

    overlay.classList.add('active');
    connectWebSocket();

    // 调用后端 API
    let data;
    if (type === 'custom' && customPaths) {
      data = await apiPost('/api/v1/scan/custom', { paths: customPaths });
    } else {
      data = await apiPost(`/api/v1/scan/${type}`, {});
    }

    if (data && data.task_id) {
      currentTaskId = data.task_id;
      statusText.textContent = '扫描已启动，正在检查文件...';
      remaining.textContent = '预计剩余: ' + formatTimeEstimate(type === 'quick' ? 300 : type === 'full' ? 3600 : 480);

      // 轮询任务状态
      const poll = setInterval(async () => {
        const status = await apiGet(`/api/v1/scan/${currentTaskId}/status`);
        if (!status) {
          clearInterval(poll);
          finishScan(false, '无法连接到扫描引擎');
          return;
        }
        if (status.status === 'completed') {
          clearInterval(poll);
          finishScan(true, status.result);
        } else if (status.status === 'failed') {
          clearInterval(poll);
          finishScan(false, status.error || '扫描失败');
        } else if (status.status === 'cancelled') {
          clearInterval(poll);
          finishScan(false, '扫描已取消');
        } else {
          // 兜底：如果 WebSocket 不可用，用轮询更新
          if (status.progress && (!ws || ws.readyState !== WebSocket.OPEN)) {
            bar.style.width = `${status.progress}%`;
            filesChecked.textContent = '已检查: ... 个文件';
            percent.textContent = `${status.progress}%`;
            statusText.textContent = status.current_file || '扫描中...';
          }
        }
      }, 500);
    } else {
      finishScan(false, '扫描引擎未响应，请确认后端已启动');
    }
  }

  function finishScan(success, result) {
    const title = document.getElementById('scanTitle');
    const statusText = document.getElementById('scanStatusText');
    const bar = document.getElementById('progressBarFill');
    const filesChecked = document.getElementById('scanFilesChecked');
    const percent = document.getElementById('scanPercent');
    const remaining = document.getElementById('scanRemaining');

    if (success) {
      bar.style.width = '100%';
      percent.textContent = '100%';
      statusText.textContent = '扫描完成';
      remaining.textContent = '完成';
      if (result) {
        const stats = result || {};
      filesChecked.textContent = '已检查: ' + ((stats.files_scanned || 0).toLocaleString()) + ' 个文件';
      title.textContent = SCAN_LABELS[result.scan_type] ? SCAN_LABELS[result.scan_type] + ' 完成' : '扫描完成';
        statusText.textContent = result.threats_found > 0
          ? `发现 ${result.threats_found} 个威胁`
          : '未发现威胁，系统安全';
      }
      setTimeout(() => renderHistory(), 1000);
    } else {
      statusText.textContent = result || '扫描失败';
    }

    setTimeout(() => {
      const overlay = document.getElementById('scanOverlay');
      if (overlay.classList.contains('active')) {
        overlay.classList.remove('active');
      }
    }, 3000);
  }

  function closeScan() {
    if (currentTaskId) {
      apiPost(`/api/v1/scan/${currentTaskId}/cancel`, {});
    }
    document.getElementById('scanOverlay').classList.remove('active');
  }

  // ── 自定义扫描文件夹选择 ──
  async function openFolderDialog() {
    // 先尝试调用后端原生文件夹选择器（长超时，等待用户选择）
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 120000); // 2分钟超时
      const res = await fetch(`${API_BASE}/api/v1/utils/pick-folder`, { signal: controller.signal });
      clearTimeout(timeoutId);
      const data = await res.json();
      if (data && data.path) {
        triggerScan('custom', [data.path]);
        return;
      }
    } catch(e) {
      if (e.name === 'AbortError') {
        console.warn('文件夹选择超时');
      } else {
        console.warn('文件夹选择API不可用，使用手动输入:', e.message);
      }
    }
    // 回退：显示手动输入对话框
    document.getElementById('folderDialog').classList.add('active');
    document.getElementById('folderInput').value = '';
    setTimeout(function() {
      document.getElementById('folderInput').focus();
    }, 100);
  }

  function closeFolderDialog() {
    document.getElementById('folderDialog').classList.remove('active');
  }

  function startCustomScan() {
    var input = document.getElementById('folderInput').value.trim();
    if (!input) {
      alert('请输入要扫描的文件夹路径');
      return;
    }
    var paths = input.split(',').map(function(p) { return p.trim(); }).filter(function(p) { return p.length > 0; });
    closeFolderDialog();
    triggerScan('custom', paths);
  }

  // ── Render Scan History from API ──
  async function renderHistory() {
    const container = document.getElementById('history-container');
    const data = await apiGet('/api/v1/stats/activity');

    if (!data || (!data.scans.length && !data.threats.length)) {
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L4 6v6c0 5.3 3.6 10.2 8 11.5 4.4-1.3 8-6.2 8-11.5V6L12 2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <p>暂无扫描记录</p>
          <span>点击上方扫描卡片开始首次扫描</span>
        </div>`;
      return;
    }

    // 只取扫描记录
    const scans = (data.scans || []).filter(s => s.event === 'scan_complete' || s.event === 'scan_start');
    if (scans.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L4 6v6c0 5.3 3.6 10.2 8 11.5 4.4-1.3 8-6.2 8-11.5V6L12 2z"/><circle cx="12" cy="12" r="3"/></svg>
          <p>暂无扫描记录</p>
          <span>点击上方扫描卡片开始首次扫描</span>
        </div>`;
      return;
    }

    let tableHTML = `
      <table class="history-table">
        <thead><tr><th>扫描类型</th><th>状态</th><th>详情</th><th>时间</th></tr></thead>
        <tbody>`;

    const completedScans = scans.filter(s => s.event === 'scan_complete');
    if (completedScans.length === 0) {
      // 回退：显示所有扫描事件
      scans.forEach(function(s) {
        const stats = s.stats || {};
        const filesCount = (stats.files_scanned || 0).toLocaleString();
        const threats = stats.threats_found || 0;
        const scanType = s.scan_type || 'quick';
        const label = SCAN_LABELS[scanType] || scanType;

        let statusHTML = threats > 0
          ? '<span class="history-status"><span class="dot threat"></span>发现 ' + threats + ' 个威胁</span>'
          : '<span class="history-status"><span class="dot clean"></span>安全</span>';

        let timeStr = '';
        try { timeStr = new Date(s.timestamp).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); } catch(e) {}

        tableHTML += `<tr>
          <td data-label="扫描类型"><span class="scan-type-badge ${scanType}">${label}</span></td>
          <td data-label="状态">${statusHTML}</td>
          <td data-label="详情">扫描 ${filesCount} 个文件</td>
          <td data-label="时间">${timeStr}</td>
        </tr>`;
      });
    } else {
      completedScans.forEach(function(s) {
        const stats = s.stats || {};
        const filesCount = (stats.files_scanned || 0).toLocaleString();
        const threats = stats.threats_found || 0;
        const scanType = s.scan_type || 'quick';
        const label = SCAN_LABELS[scanType] || scanType;

        let statusHTML = threats > 0
          ? '<span class="history-status"><span class="dot threat"></span>发现 ' + threats + ' 个威胁</span>'
          : '<span class="history-status"><span class="dot clean"></span>安全</span>';

        let timeStr = '';
        try { timeStr = new Date(s.timestamp).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); } catch(e) {}

        tableHTML += `<tr>
          <td data-label="扫描类型"><span class="scan-type-badge ${scanType}">${label}</span></td>
          <td data-label="状态">${statusHTML}</td>
          <td data-label="详情">扫描 ${filesCount} 个文件，检出 ${threats} 个威胁</td>
          <td data-label="时间">${timeStr}</td>
        </tr>`;
      });
    }

    tableHTML += '</tbody></table>';
    container.innerHTML = tableHTML;
  }

  async function clearHistory() {
    await apiPost('/api/v1/logs/clear', {});
    renderHistory();
  }

  // ── Init ──
  function initScanPage() {
    renderHistory();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initScanPage);
  } else {
    initScanPage();
  }
</script>

</body>
