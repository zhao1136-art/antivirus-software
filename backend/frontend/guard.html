<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卫士体检 - 御天</title><script>(function(){try{var s=JSON.parse(localStorage.getItem('安盾_settings')||'{}');if(s.theme==='light')document.documentElement.classList.add('light');}catch(e){}}())</script>
    <style>
        :root {
            --bg-primary: #0a1f2e;
            --bg-secondary: #0e0e14;
            --bg-card: #13131c;
            --bg-hover: #1a1a26;
            --border: #252536;
            --border-light: #2f2f44;
            --text-primary: #f4f4f9;
            --text-secondary: #8f8fab;
            --text-muted: #5c5c75;
            --accent: #00bcd4;
            --accent-dim: rgba(0, 188, 212, 0.12);
            --accent-glow: rgba(0, 188, 212, 0.35);
            --danger: #ff4d6d;
            --danger-dim: rgba(255, 77, 109, 0.12);
            --warning: #ffcc00;
            --success: #00bcd4;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 188, 212, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 110, 255, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            pointer-events: none; z-index: 0;
        }
        .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }
        .sidebar {
            width: 72px; background: rgba(14, 14, 20, 0.85);
            backdrop-filter: blur(20px); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 8px; position: fixed; height: 100vh; z-index: 100;
        }
        .logo { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 0; margin-bottom: 24px; }
        .logo-icon {
            width: 40px; height: 40px; border-radius: 12px; overflow: hidden;
            display: grid; place-items: center;
            box-shadow: 0 8px 24px rgba(0, 188, 212, 0.25);
        }
        .logo-icon svg { width: 100%; height: 100%; fill: var(--accent); }
        .nav { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; width: 100%; }
        .nav-item {
            display: flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; border-radius: 12px;
            color: var(--text-muted); text-decoration: none;
            position: relative; transition: var(--transition);
        }
        .nav-item svg { width: 22px; height: 22px; }
        .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent); }
        .nav-item:hover::after {
            content: attr(data-title);
            position: absolute; left: 100%; margin-left: 14px;
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500;
            color: var(--text-primary); white-space: nowrap; z-index: 300;
            pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .nav-item.active:hover::after { border-color: rgba(0, 188, 212, 0.3); color: var(--accent); }
        .nav-group { width: 100%; text-align: center; padding: 14px 0 6px; font-size: 0; user-select: none; }
        .nav-group::before {
            content: ''; display: block; width: 20px; height: 1px;
            background: var(--border); margin: 0 auto;
        }
        .nav-item[href="settings.html"] { margin-top: auto; }
        .main { flex: 1; margin-left: 72px; padding: 32px 40px; max-width: calc(100% - 72px); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 36px; }
        .header-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; }
        .status-pill {
            display: flex; align-items: center; gap: 8px; padding: 8px 16px;
            background: var(--accent-dim); border: 1px solid rgba(0, 188, 212, 0.2);
            border-radius: 30px; font-size: 13px; font-weight: 600; color: var(--accent);
        }
        .pulse { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 0 rgba(0, 188, 212, 0.7); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 188, 212, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(0, 188, 212, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 188, 212, 0); } }
        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 28px; transition: var(--transition);
        }
        .card:hover { border-color: var(--border-light); transform: translateY(-2px); }
        .card-title {
            font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600;
            color: var(--text-secondary); text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 24px;
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 24px; border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent), #00b4a6); color: #000; }
        .btn-primary:hover { box-shadow: 0 6px 20px var(--accent-glow); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text-primary); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        /* 取消按钮：运行期间可见可点，结束后隐藏（取消是正常路径，用中性黄而非红色） */
        .btn-cancel { background: transparent; border: 1px solid var(--warning); color: var(--warning); }
        .btn-cancel:hover:not(:disabled) { background: rgba(255,204,0,0.12); }
        .btn-cancel:disabled { opacity: 0.55; cursor: default; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* ── 体检报告 ── */
        .report-grid { display: grid; grid-template-columns: 360px 1fr; gap: 24px; margin-bottom: 24px; }
        .score-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px; }
        .score-ring { position: relative; width: 200px; height: 200px; }
        .score-ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .score-ring-bg { fill: none; stroke: var(--bg-hover); stroke-width: 10; }
        .score-ring-progress { fill: none; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 502; stroke-dashoffset: 0; transition: stroke-dashoffset 1s ease; }
        .score-ring-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .score-num { font-family: 'Syne', sans-serif; font-size: 52px; font-weight: 700; line-height: 1; }
        .score-label { color: var(--text-secondary); font-size: 13px; margin-top: 8px; }
        .score-level { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
        .check-list { display: flex; flex-direction: column; gap: 14px; }
        .check-item {
            display: flex; align-items: center; gap: 14px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 16px 18px;
        }
        .check-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
        .check-icon svg { width: 18px; height: 18px; }
        .check-icon.ok { background: var(--accent-dim); color: var(--accent); }
        .check-icon.warn { background: rgba(255, 204, 0, 0.12); color: var(--warning); }
        .check-icon.danger { background: var(--danger-dim); color: var(--danger); }
        .check-body { flex: 1; min-width: 0; }
        .check-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
        .check-detail { font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .check-action { flex-shrink: 0; }
        .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.5px; }
        .tag.ok { background: var(--accent-dim); color: var(--accent); }
        .tag.warn { background: rgba(255, 204, 0, 0.12); color: var(--warning); }
        .tag.danger { background: var(--danger-dim); color: var(--danger); }

        /* ── 功能入口卡片 ── */
        .feature-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        .feature-card {
            text-decoration: none; color: inherit; display: flex; flex-direction: column;
            align-items: center; gap: 14px; padding: 28px 16px; text-align: center;
        }
        .feature-icon {
            width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
            background: var(--accent-dim); color: var(--accent);
        }
        .feature-icon svg { width: 26px; height: 26px; }
        .feature-card:hover .feature-icon { box-shadow: 0 8px 24px var(--accent-glow); }
        .feature-name { font-size: 15px; font-weight: 700; }
        .feature-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

        /* ── 清理历史 ── */
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item {
            display: flex; align-items: center; gap: 14px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 14px 16px; font-size: 13px;
        }
        .history-time { color: var(--text-muted); font-family: 'Syne', sans-serif; width: 150px; flex-shrink: 0; }
        .history-cats { flex: 1; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-freed { color: var(--accent); font-weight: 700; flex-shrink: 0; }
        .empty { color: var(--text-muted); text-align: center; padding: 30px 0; font-size: 13px; }
        .spinner {
            width: 18px; height: 18px; border: 2px solid rgba(0, 188, 212, 0.25);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; top: 24px; right: 24px; z-index: 999;
            background: var(--bg-card); border: 1px solid var(--border-light);
            border-left: 3px solid var(--accent); border-radius: var(--radius-sm);
            padding: 14px 20px; font-size: 13px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transform: translateX(120%); transition: transform 0.3s ease; max-width: 360px;
        }
        .toast.show { transform: translateX(0); }
    
        /* ── 实时防护 · CPU 节流（档位按钮） ── */
        .rtg-levels { display: flex; gap: 12px; flex-wrap: wrap; }
        .rtg-level {
            flex: 1 1 150px; padding: 14px 12px; cursor: pointer; font-family: inherit;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-md); color: var(--text-primary);
            text-align: center; transition: var(--transition);
        }
        .rtg-level:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
        .rtg-level.on { background: var(--accent-dim); border-color: var(--accent); }
        .rtg-level:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
        .rtg-level .rtg-name { display: block; font-size: 15px; font-weight: 700; }
        .rtg-level .rtg-pct { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
        .rtg-level.on .rtg-pct { color: var(--accent); }
        .rtg-meter { height: 8px; border-radius: 5px; background: var(--bg-hover); overflow: hidden; margin: 16px 0 14px; }
        .rtg-meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.4s ease; }
        .rtg-meter.over i { background: var(--warning); }
        .rtg-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 14px; }
        .rtg-stats .k { font-size: 12px; color: var(--text-secondary); }
        .rtg-stats .v { font-size: 17px; font-weight: 700; margin-top: 2px; }
        .rtg-live { font-size: 13px; color: var(--text-secondary); margin-top: 12px; }
        .rtg-off { color: var(--warning); }

        /* ---------- 移动端汉堡菜单（与其余页面统一，断点 768） ---------- */
        .nav-toggle {
            display: none; position: fixed; top: 14px; left: 14px; z-index: 200;
            width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
            align-items: center; justify-content: center;
            background: var(--bg-card, #1b2027); border: 1px solid var(--border, #2c343f);
            color: var(--text-primary, #e6e9ee); box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .nav-toggle svg { width: 20px; height: 20px; }
        .nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 150; }
        .nav-overlay.show { display: block; }
        @media (max-width: 768px) {
            .nav-toggle { display: flex; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
            .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.4); }
            .main { margin-left: 0; max-width: 100%; }
        }
    </style>
</head>

    <main class="main">

            </a>
            <a class="card feature-card" href="optimize.html">
                <div class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
                <div class="feature-name">电脑优化</div>
                <div class="feature-desc">启动项 / 服务 / 内存优化</div>
            </a>
            <a class="card feature-card" href="scan.html">
                <div class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94M9.69 16 3.95 6.06M14.31 16H2.83M16.62 12l-5.74 9.94"/></svg></div>
                <div class="feature-name">木马查杀</div>
                <div class="feature-desc">多引擎深度查杀木马病毒</div>
            </a>
        </div>

        <!-- 一键优化 -->
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
            <div>
                <div style="font-size:15px;font-weight:700;margin-bottom:4px">一键优化</div>
                <div style="font-size:13px;color:var(--text-secondary)">清理临时垃圾、释放内存，并给出启动项优化建议</div>
            </div>
            <div style="display:flex;gap:10px;align-items:center">
                <button class="btn btn-primary" id="btnOneClick" onclick="runOneClick()">开始优化</button>
                <button class="btn btn-cancel" id="btnCancelOneClick" onclick="cancelOneClick()" style="display:none">
                    <span>取消优化</span>
                </button>
            </div>
        </div>

        <!-- 实时防护 · CPU 节流（rtguard，后端 /api/v1/rtguard/*） -->
        <div class="card" style="margin-bottom:24px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px">
                <div>
                    <div style="font-size:15px;font-weight:700;margin-bottom:4px">实时防护 · CPU 节流</div>
                    <div style="font-size:13px;color:var(--text-secondary)" id="rtgHint">正在读取实时防护状态…</div>
                </div>
                <div style="display:flex;gap:10px;align-items:center">
                    <span class="tag warn" id="rtgStateTag">检测中</span>
                    <button class="btn btn-primary" id="rtgStartBtn" onclick="rtgStart()" style="display:none">启动实时防护</button>
                </div>
            </div>
            <div class="rtg-levels" id="rtgLevels">
                <button class="rtg-level" data-level="low" onclick="rtgSetLevel('low')">
                    <span class="rtg-name">低</span><span class="rtg-pct" data-pct="low">5%</span>
                </button>
                <button class="rtg-level" data-level="medium" onclick="rtgSetLevel('medium')">
                    <span class="rtg-name">中</span><span class="rtg-pct" data-pct="medium">10%</span>
                </button>
                <button class="rtg-level" data-level="high" onclick="rtgSetLevel('high')">
                    <span class="rtg-name">高</span><span class="rtg-pct" data-pct="high">15%</span>
                </button>
            </div>
            <div class="rtg-meter" id="rtgMeter"><i id="rtgMeterFill"></i></div>
            <div class="rtg-live" id="rtgLive">—</div>
            <div class="rtg-stats" id="rtgStats" style="margin-top:16px"></div>
        </div>

        <!-- 清理历史 -->
        <div class="card">
            <h3 class="card-title">最近清理记录</h3>
            <div class="history-list" id="historyList">
                <div class="empty">暂无清理记录</div>
            </div>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '';
let toastTimer = null;

function showToast(msg, isError, isWarn) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderLeftColor = isWarn ? 'var(--warning)' : (isError ? 'var(--danger)' : 'var(--accent)');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

async function apiGet(path) {
    try { const res = await fetch(`${API_BASE}${path}`); return await res.json(); }
    catch (e) { console.warn('API 不可用:', e.message); return null; }
}
async function apiPost(path, body) {
    try {
        const res = await fetch(`${API_BASE}${path}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body || {})
        });
        return await res.json();
    } catch (e) { console.warn('API 不可用:', e.message); return null; }
}

function levelColor(score) {
    if (score >= 85) return '#00bcd4';
    if (score >= 60) return '#ffcc00';
    return '#ff4d6d';
}
function levelText(score) {
    if (score >= 85) return '状态优秀';
    if (score >= 60) return '状态良好';
    if (score >= 40) return '需要优化';
    return '状态堪忧';
}

const CHECK_ICONS = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    danger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
};
const CHECK_ACTIONS = {
    disk: { label: '去清理', href: 'clean.html' },
    temp: { label: '去清理', href: 'clean.html' },
    memory: { label: '去优化', href: 'optimize.html' },
    startup: { label: '去管理', href: 'optimize.html' }
};

async function loadOverview() {
    const btn = document.getElementById('btnRecheck');
    btn.disabled = true;
    overviewJobId = null;
    // 体检改为可取消的后台任务（后端 SystemOptimizer.overview 支持 cancel 令牌）
    const job = await apiPost('/api/v1/jobs', { kind: 'optimize-overview', params: {} });
    if (!job || !job.task_id) {
        btn.disabled = false;
        document.getElementById('checkList').innerHTML = '<div class="empty">体检数据获取失败，请确认服务已启动</div>';
        return;
    }
    overviewJobId = job.task_id;
    setCancelBtn('btnCancelRecheck', true, false, '正在取消…', '取消体检');
    const data = await pollJobUntilDone(job.task_id, p => {
        if (p && p.current) document.getElementById('scoreLevel').textContent = p.current + '…';
    });
    setCancelBtn('btnCancelRecheck', false, false, '正在取消…', '取消体检');
    overviewJobId = null;
    btn.disabled = false;
    if (data && data.cancelled) {
        // 取消是正常路径：不弹红色错误
        document.getElementById('scoreLevel').textContent = '体检已取消';
        showToast('体检已取消', false, true);
        return;
    }
    if (!data || data.error || !data.checks) {
        document.getElementById('checkList').innerHTML = '<div class="empty">体检数据获取失败，请确认服务已启动</div>';
        return;
    }
    const score = data.score;
    const color = levelColor(score);
    document.getElementById('scoreNum').textContent = score;
    document.getElementById('scoreLevel').textContent = levelText(score);
    document.getElementById('scoreLevel').style.color = color;
    const circle = document.getElementById('scoreCircle');
    circle.setAttribute('stroke', color);
    setTimeout(() => circle.setAttribute('stroke-dashoffset', 502 - 502 * score / 100), 100);

    const list = document.getElementById('checkList');
    list.innerHTML = '';
    data.checks.forEach(c => {
        const act = CHECK_ACTIONS[c.id];
        const item = document.createElement('div');
        item.className = 'check-item';
        item.innerHTML = `
            <div class="check-icon ${c.status}">${CHECK_ICONS[c.status] || CHECK_ICONS.ok}</div>
            <div class="check-body">
                <div class="check-name">${c.name} <span class="tag ${c.status}">${c.status === 'ok' ? '正常' : c.status === 'warn' ? '关注' : '异常'}</span></div>
                <div class="check-detail">${c.detail}</div>
            </div>
            ${act && c.status !== 'ok' ? `<a class="btn btn-outline check-action" style="padding:8px 16px;font-size:12px;text-decoration:none" href="${act.href}">${act.label}</a>` : ''}`;
        list.appendChild(item);
    });
}

async function loadHistory() {
    const data = await apiGet('/api/v1/clean/history');
    const list = document.getElementById('historyList');
    if (!data || !data.records || !data.records.length) {
        list.innerHTML = '<div class="empty">暂无清理记录</div>';
        return;
    }
    list.innerHTML = '';
    data.records.forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        const cats = (r.categories || []).map(c => c.name).join('、') || '未知分类';
        const time = (r.timestamp || '').replace('T', ' ').slice(0, 16);
        item.innerHTML = `
            <span class="history-time">${time}</span>
            <span class="history-cats">${cats}（${r.cleaned_files || 0} 项）</span>
            <span class="history-freed">${r.freed_text || '0 B'}</span>`;
        list.appendChild(item);
    });
}

async function runOneClick() {
    const btn = document.getElementById('btnOneClick');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 优化中…';
    const job = await apiPost('/api/v1/jobs', { kind: 'optimize-one-click', params: {} });
    if (!job || !job.task_id) {
        btn.disabled = false;
        btn.textContent = '开始优化';
        showToast('一键优化失败', true);
        return;
    }
    oneClickJobId = job.task_id;
    setCancelBtn('btnCancelOneClick', true, false, '正在取消…', '取消优化');
    const data = await pollJobUntilDone(job.task_id);
    setCancelBtn('btnCancelOneClick', false, false, '正在取消…', '取消优化');
    oneClickJobId = null;
    btn.disabled = false;
    btn.textContent = '开始优化';
    if (!data || (data.error && !data.cancelled)) {
        showToast((data && data.error) || '一键优化失败', true);
        return;
    }
    if (data.cancelled) {
        const parts0 = [];
        if (data.clean && data.clean.success) parts0.push(`已清理 ${data.clean.freed_text}`);
        showToast('优化已取消' + (parts0.length ? '（' + parts0.join('，') + '）' : ''), false, true);
        loadOverview();
        loadHistory();
        return;
    }
    const parts = [];
    if (data.clean && data.clean.success) parts.push(`清理释放 ${data.clean.freed_text}`);
    if (data.memory && data.memory.success) parts.push(`内存释放 ${data.memory.released_text}`);
    showToast('优化完成：' + parts.join('，'));
    loadOverview();
    loadHistory();
}

// ── 可取消任务通用轮询（通用 /api/v1/jobs 接口）──
let overviewJobId = null;
let oneClickJobId = null;

function setCancelBtn(id, visible, busy, busyText, normalText) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.style.display = visible ? 'inline-flex' : 'none';
    btn.disabled = !!busy;
    const span = btn.querySelector('span');
    if (span) span.textContent = busy ? busyText : normalText;
}

function pollJobUntilDone(taskId, onTick) {
    return new Promise(resolve => {
        const timer = setInterval(async () => {
            const st = await apiGet('/api/v1/jobs/' + taskId + '/status');
            if (!st) { clearInterval(timer); resolve(null); return; }
            if (st.status === 'queued' || st.status === 'running') {
                if (onTick) onTick(st);
                return;
            }
            clearInterval(timer);
            if (st.status === 'cancelled') resolve({ cancelled: true, partial: st.result });
            else if (st.status === 'failed') resolve({ error: st.error || '任务失败' });
            else resolve(st.result);
        }, 400);
    });
}

async function cancelRecheck() {
    if (!overviewJobId) return;
    setCancelBtn('btnCancelRecheck', true, true, '正在取消…', '取消体检');
    await apiPost('/api/v1/jobs/' + overviewJobId + '/cancel');
    showToast('已请求取消体检，正在停止…', false, true);
}

async function cancelOneClick() {
    if (!oneClickJobId) return;
    setCancelBtn('btnCancelOneClick', true, true, '正在取消…', '取消优化');
    await apiPost('/api/v1/jobs/' + oneClickJobId + '/cancel');
    showToast('已请求取消优化，正在停止…', false, true);
}

// ── 实时防护（rtguard）联动：三个档位按钮 + 实时占用 ──
const RTG_FALLBACK_LEVELS = {
    low: { label: '低 5%', pct: 5 },
    medium: { label: '中 10%', pct: 10 },
    high: { label: '高 15%', pct: 15 }
};
const RTG_STATS = [['规则', 'rules'], ['已扫描', 'scanned'], ['可疑', 'suspicious'],
                   ['恶意', 'malicious'], ['隔离区', 'quarantine'], ['缓存命中', 'cache_hits']];
let rtgBusy = false;

function rtgRender(d) {
    const ok = !!(d && d.available);
    const levels = (d && d.levels && Object.keys(d.levels).length) ? d.levels : RTG_FALLBACK_LEVELS;
    document.querySelectorAll('.rtg-level').forEach(btn => {
        const lv = levels[btn.dataset.level];
        if (lv) {
            const m = /^(.*?)\s*(\d+(?:\.\d+)?)%\s*$/.exec(lv.label || '');
            if (m && m[1]) btn.querySelector('.rtg-name').textContent = m[1];
            btn.querySelector('.rtg-pct').textContent = '上限 ' + lv.pct + '%';
        }
        btn.classList.toggle('on', ok && d.level === btn.dataset.level);
        btn.disabled = !ok || rtgBusy;
    });

    const tag = document.getElementById('rtgStateTag');
    tag.textContent = ok ? '运行中' : '未运行';
    tag.className = 'tag ' + (ok ? 'ok' : 'warn');
    document.getElementById('rtgStartBtn').style.display = ok ? 'none' : 'inline-flex';

    const live = document.getElementById('rtgLive');
    live.textContent = '';
    const stats = document.getElementById('rtgStats');
    const fill = document.getElementById('rtgMeterFill');
    const meter = document.getElementById('rtgMeter');

    if (!ok) {
        const span = document.createElement('span');
        span.className = 'rtg-off';
        span.textContent = '实时防护未运行';
        live.appendChild(span);
        if (d && d.error) live.appendChild(document.createTextNode(' · ' + d.error));
        document.getElementById('rtgHint').textContent = '点「启动实时防护」即可拉起（默认低 5%）';
        fill.style.width = '0%';
        meter.classList.remove('over');
        rtgRenderStats(stats, null);
        return;
    }

    const actual = Number(d.actual_pct || 0);
    const target = Number(d.target_pct || 1);
    live.textContent = '实际 ' + d.actual_pct + '% / 目标 ' + d.target_pct + '% · 允许 ' +
        d.budget_cores + ' 核（' + d.cores + ' 核机器）' +
        (d.uptime_h === undefined || d.uptime_h === null ? '' : ' · 已运行 ' + d.uptime_h + ' 小时');
    fill.style.width = Math.min(100, actual / Math.max(target, 1) * 100) + '%';
    meter.classList.toggle('over', actual > target * 1.5);
    document.getElementById('rtgHint').textContent =
        '当前档位：' + (d.label || d.level || '--') + '（占系统 CPU 上限 ' + d.target_pct + '%）';
    rtgRenderStats(stats, d.stats || {});
}

function rtgRenderStats(grid, s) {
    grid.innerHTML = '';
    RTG_STATS.forEach(pair => {
        const v = s ? s[pair[1]] : null;
        const cell = document.createElement('div');
        const k = document.createElement('div');
        k.className = 'k';
        k.textContent = pair[0];
        const val = document.createElement('div');
        val.className = 'v';
        val.textContent = (v === undefined || v === null) ? '--' : v;
        cell.appendChild(k);
        cell.appendChild(val);
        grid.appendChild(cell);
    });
}

async function rtgTick() {
    rtgRender(await apiGet('/api/v1/rtguard/status'));
}

async function rtgSetLevel(level) {
    if (rtgBusy) return;
    rtgBusy = true;
    document.querySelectorAll('.rtg-level').forEach(b => { b.disabled = true; });
    const r = await apiPost('/api/v1/rtguard/throttle', { level: level });
    rtgBusy = false;
    if (!r || !r.success) showToast((r && r.error) || '档位切换失败', true);
    else showToast('实时防护 CPU 上限已切换为 ' + ((r.status && r.status.label) || level));
    await rtgTick();
}

async function rtgStart() {
    const btn = document.getElementById('rtgStartBtn');
    if (rtgBusy) return;
    rtgBusy = true;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 启动中…';
    const r = await apiPost('/api/v1/rtguard/start', { level: 'low' });
    rtgBusy = false;
    btn.disabled = false;
    btn.textContent = '启动实时防护';
    if (!r || !r.success) showToast((r && r.error) || '实时防护启动失败', true);
    else showToast(r.already_running ? '实时防护已在运行' : '实时防护已启动');
    await rtgTick();
}

rtgTick();
setInterval(function () { if (!document.hidden) rtgTick(); }, 3000);

loadOverview();
loadHistory();
</script>

</button>

<script>
// 移动端汉堡菜单切换：按钮展开/收起侧栏，点遮罩或按 Esc 关闭
(function () {
    var btn = document.getElementById('navToggle');
    var overlay = document.getElementById('navOverlay');
    var sidebar = document.querySelector('.sidebar');
    if (!btn || !sidebar) return;
    function setOpen(open) {
        sidebar.classList.toggle('open', open);
        if (overlay) overlay.classList.toggle('show', open);
        btn.setAttribute('aria-expanded', String(open));
    }
    btn.addEventListener('click', function () { setOpen(!sidebar.classList.contains('open')); });
    if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
