<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据恢复 - 御天</title><script>(function(){try{var s=JSON.parse(localStorage.getItem('御天_settings')||'{}');if(s.theme==='light')document.documentElement.classList.add('light');}catch(e){}}())</script>
    <style>
        :root{--bg-primary:#0a1f2e;--bg-secondary:#0e0e14;--bg-card:#13131c;--bg-hover:#1a1a26;--border:#252536;--border-light:#2f2f44;--text-primary:#f4f4f9;--text-secondary:#8f8fab;--text-muted:#5c5c75;--accent:#00bcd4;--accent-dim:rgba(0,188,212,0.12);--accent-glow:rgba(0,188,212,0.35);--danger:#ff4d6d;--danger-dim:rgba(255,77,109,0.12);--warning:#ffcc00;--success:#00bcd4;--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.06) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.05) 0%,transparent 40%),linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px;pointer-events:none;z-index:0}
        .app{display:flex;min-height:100vh;position:relative;z-index:1}
        .sidebar{width:72px;background:rgba(14,14,20,0.85);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 8px;position:fixed;height:100vh;z-index:100}
        .logo{display:flex;flex-direction:column;align-items:center;gap:0;padding:0;margin-bottom:24px}
        .logo-icon{width:40px;height:40px;border-radius:12px;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,188,212,0.25)}
        .logo-icon img{width:100%;height:100%;object-fit:cover}
        .logo-text{display:none}
        .nav{display:flex;flex-direction:column;align-items:center;width:100%;gap:6px;flex:1}
        .nav-item{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:12px;color:var(--text-secondary);text-decoration:none;font-size:0;font-weight:500;transition:var(--transition);cursor:pointer;border:1px solid transparent;position:relative}
        .nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
        .nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,188,212,0.2)}
        .nav-item svg{width:22px;height:22px;opacity:0.85}
        .nav-item.active svg{opacity:1}
        .nav-item[href="settings.html"]{margin-top:auto}
        .nav-badge{position:absolute;top:0;right:-2px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;border-radius:10px;border:2px solid var(--bg-primary);line-height:1.4}
        .nav-group{width:100%;text-align:center;padding:14px 0 6px;font-size:0;user-select:none;position:relative}.nav-group::before{content:'';display:block;width:20px;height:1px;background:var(--border);margin:0 auto}
        .main{flex:1;margin-left:72px;padding:32px 40px;max-width:calc(100% - 72px)}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
        .header-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:700}
        .header-meta{display:flex;align-items:center;gap:20px}
        .time{color:var(--text-secondary);font-size:13px;font-family:'Syne',sans-serif;font-weight:500}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;transition:var(--transition);margin-bottom:24px}
        .card:hover{border-color:var(--border-light)}
        .card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:24px}
        .card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .card-desc{font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:var(--transition);white-space:nowrap}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#00b4a6);color:#000;box-shadow:0 4px 16px var(--accent-glow)}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
        .btn-danger{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,77,109,0.2)}
        .btn-danger:hover{background:var(--danger);color:#fff}
        .btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
        .btn-outline:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-light)}
        .btn-sm{padding:6px 14px;font-size:12px}
/* 取消按钮：运行期间可见可点，结束后隐藏（取消是正常路径，用中性黄而非红色） */
.btn-cancel{background:transparent;color:var(--warning);border:1px solid var(--warning)}
.btn-cancel:hover:not(:disabled){background:rgba(255,204,0,0.12)}
.btn-cancel:disabled{opacity:0.55;cursor:default}
/* 轻量提示条（与 clean/optimize/guard 页面的 showToast 视觉一致） */
.toast{position:fixed;top:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--accent);color:var(--text-primary);font-size:13px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,0.35);transform:translateX(140%);transition:transform 0.25s ease;pointer-events:none}
.toast.show{transform:translateX(0)}
        .stat-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-hover);border-radius:20px;font-size:12px;font-weight:600;color:var(--text-secondary)}
        .stat-chip svg{width:14px;height:14px}
        .input-text{padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:var(--transition);flex:1;min-width:200px}
        .input-text:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
        .input-text::placeholder{color:var(--text-muted)}
        select.input-text{appearance:none;cursor:pointer}
        .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
        .stat-box{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;text-align:center}
        .stat-box .num{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:var(--accent);line-height:1}
        .stat-box .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:8px}
        /* 文件树 + 版本列表布局 */
        .recovery-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:24px}
        .tree-panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;max-height:480px;overflow-y:auto}
        .tree-search{margin-bottom:12px}
        .file-tree{list-style:none;padding:0}
        .file-tree li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:var(--transition);color:var(--text-primary)}
        .file-tree li:hover{background:var(--bg-hover)}
        .file-tree li.active{background:var(--accent-dim);color:var(--accent)}
        .file-tree li svg{width:16px;height:16px;flex-shrink:0;opacity:0.85}
        .file-tree .empty{text-align:center;color:var(--text-muted);padding:24px;font-style:italic;cursor:default}
        .version-list{list-style:none;padding:0}
        .version-item{padding:14px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;transition:var(--transition)}
        .version-item:hover{border-color:var(--border-light)}
        .version-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
        .version-time{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--text-primary)}
        .version-meta{font-size:11px;color:var(--text-muted);font-family:'Courier New',monospace}
        .version-actions{display:flex;gap:8px;margin-top:8px}
        .dir-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
        .dir-tag{display:flex;align-items:center;gap:4px;padding:4px 10px;background:var(--bg-hover);border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--text-secondary);font-family:'Courier New',monospace}
        .dir-tag .remove{cursor:pointer;color:var(--danger);margin-left:4px;font-weight:700}
        .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
        .form-row label{font-size:12px;color:var(--text-secondary);min-width:90px;font-weight:600}
        .empty-block{text-align:center;color:var(--text-muted);padding:48px 24px;font-style:italic;border:1px dashed var(--border);border-radius:var(--radius-md)}
        html.light{--bg-primary:#f5f5f8;--bg-secondary:#eeeef3;--bg-card:#ffffff;--bg-hover:#e8e8f0;--border:#d8d8e4;--border-light:#c8c8d4;--text-primary:#1a1a2e;--text-secondary:#5a5a6e;--text-muted:#8a8a9e}
        html.light body::before{background:radial-gradient(circle at 20% 30%,rgba(0,188,212,0.04) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,110,255,0.03) 0%,transparent 40%),linear-gradient(rgba(0,0,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.02) 1px,transparent 1px);background-size:100% 100%,100% 100%,40px 40px,40px 40px}
        html.light .sidebar{background:rgba(255,255,255,0.85)}
        @media(max-width:1100px){.recovery-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr}}
        @media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;max-width:100%;padding:24px}}
        .nav-item:hover::after{content:attr(data-title);position:absolute;left:100%;margin-left:14px;background:var(--bg-card);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;z-index:300;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.4)}.nav-item.active:hover::after{border-color:rgba(0,188,212,0.3);color:var(--accent)}
    </style>
    <style>
        /* ---------- 统一导航增强：Logo / 移动端汉堡菜单 ---------- */
        .logo { padding: 0; margin-bottom: 22px; }
        .logo-icon { color: var(--accent); }
        .logo-icon svg { width: 26px; height: 26px; }
        .nav-toggle {
            display: none; position: fixed; top: 14px; left: 14px; z-index: 200;
            width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
            align-items: center; justify-content: center;
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-primary); box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        .nav-toggle svg { width: 20px; height: 20px; }
        .nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 150; }
        .nav-overlay.show { display: block; }
        @media (max-width: 768px) {
            .nav-toggle { display: flex; }
            .sidebar { transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
            .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.4); }
            .main { margin-left: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

    <main class="main">
        <header class="header">
            <h1 class="header-title">数据恢复</h1>
            <div class="header-meta"><span class="time" id="clock">--:--</span></div>
        </header>

        <!-- 存储占用统计 -->
        <div class="card">
            <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>存储占用统计</h3>
            <div class="stat-grid">
                <div class="stat-box"><div class="num" id="statSnapshots">0</div><div class="lbl">快照数</div></div>
                <div class="stat-box"><div class="num" id="statSize">0 MB</div><div class="lbl">存储大小</div></div>
                <div class="stat-box"><div class="num" id="statFiles">0</div><div class="lbl">受保护文件</div></div>
            </div>
        </div>

        <div class="recovery-grid">
            <!-- 左侧文件树 -->
            <div class="card">
                <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>监控文件</h3>
                <div class="tree-search">
                    <input type="text" class="input-text" id="fileSearch" placeholder="搜索文件名..." oninput="renderFileTree()" style="width:100%">
                </div>
                <div class="tree-panel">
                    <ul class="file-tree" id="fileTree"><li class="empty">暂无监控文件</li></ul>
                </div>
            </div>

            <!-- 右侧版本列表 -->
            <div class="card">
                <div class="card-row">
                    <h3 class="card-title" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>版本历史</h3>
                    <button class="btn btn-outline btn-sm" onclick="loadVersions()">刷新</button>
                    <button class="btn btn-cancel btn-sm" id="btnCancelRestore" onclick="cancelRestore()" style="display:none">
                        <span>取消恢复</span>
                    </button>
                </div>
                <div id="versionContainer">
                    <div class="empty-block">请从左侧选择一个文件查看版本历史</div>
                </div>
            </div>
        </div>

        <!-- 快照设置 -->
        <div class="card">
            <h3 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" width="16" height="16" style="margin-right:8px;vertical-align:-2px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>快照设置</h3>
            <div class="form-row">
                <label>监控目录</label>
                <input type="text" class="input-text" id="dirInput" placeholder="例如 C:\Users\Documents" style="flex:1">
                <button class="btn btn-primary btn-sm" onclick="addWatchDir()">添加</button>
            </div>
            <div class="dir-list" id="dirList"></div>
            <div class="form-row" style="margin-top:20px">
                <label>版本保留天数</label>
                <input type="number" class="input-text" id="retainDays" min="1" max="365" value="30" style="max-width:120px">
                <label>存储上限 (MB)</label>
                <input type="number" class="input-text" id="storageLimit" min="100" value="5000" style="max-width:120px">
                <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
            </div>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_BASE = ''; // 动态适配当前 origin

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent =
            String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
    updateClock();
    setInterval(updateClock, 1000);

    (function() {
        try {
            var q = JSON.parse(localStorage.getItem('御天_quarantine') || '[]');
            var el = document.getElementById('quarantineBadge');
            if (el) el.textContent = q.length || '0';
        } catch(e) {}
    })();

    async function apiGet(path) {
        try { const r = await fetch(API_BASE + path); return await r.json(); }
        catch(e) { console.warn(e); return null; }
    }
    async function apiPost(path, body) {
        try {
            const r = await fetch(API_BASE + path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
            return await r.json();
        } catch(e) { console.warn(e); return null; }
    }
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

    // ── 提示条 ──
    let toastTimer = null;
    function showToast(msg, isError, isWarn) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.style.borderLeftColor = isWarn ? 'var(--warning)' : (isError ? 'var(--danger)' : 'var(--accent)');
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // ── 可取消任务通用轮询（通用 /api/v1/jobs 接口）──
    let restoreJobId = null;

    function setCancelBtn(id, visible, busy, busyText, normalText) {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.style.display = visible ? 'inline-flex' : 'none';
        btn.disabled = !!busy;
        const span = btn.querySelector('span');
        if (span) span.textContent = busy ? busyText : normalText;
    }

    function pollJobUntilDone(taskId, onTick) {
        return new Promise(resolve => {
            const timer = setInterval(async () => {
                const st = await apiGet('/api/v1/jobs/' + taskId + '/status');
                if (!st) { clearInterval(timer); resolve(null); return; }
                if (st.status === 'queued' || st.status === 'running') {
                    if (onTick) onTick(st);
                    return;
                }
                clearInterval(timer);
                if (st.status === 'cancelled') resolve({ cancelled: true, partial: st.result });
                else if (st.status === 'failed') resolve({ error: st.error || '任务失败' });
                else resolve(st.result);
            }, 400);
        });
    }

    let allFiles = [];
    let currentFile = null;

    // 存储统计
    async function loadStats() {
        const data = await apiGet('/api/v1/recovery/stats');
        if (!data) return;
        document.getElementById('statSnapshots').textContent = data.snapshot_count || 0;
        document.getElementById('statSize').textContent = formatSize(data.storage_size || 0);
        document.getElementById('statFiles').textContent = data.file_count || 0;
    }
    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
        if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
        return (bytes/1024/1024/1024).toFixed(2) + ' GB';
    }

    // 文件树
    async function loadFiles() {
        const data = await apiGet('/api/v1/recovery/files');
        allFiles = (data && (data.files || data.list)) || [];
        renderFileTree();
    }
    function renderFileTree() {
        const ul = document.getElementById('fileTree');
        const kw = document.getElementById('fileSearch').value.trim().toLowerCase();
        const filtered = kw ? allFiles.filter(f => (f.path||f.name||'').toLowerCase().includes(kw)) : allFiles;
        if (!filtered.length) { ul.innerHTML = '<li class="empty">暂无监控文件</li>'; return; }
        ul.innerHTML = filtered.map((f,i)=>{
            const idx = allFiles.indexOf(f);
            const name = f.name || (f.path||'').split(/[\\/]/).pop() || '未命名';
            const active = currentFile && (currentFile === f.path || currentFile === idx);
            return `<li class="${active?'active':''}" onclick="selectFile(${idx})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                ${esc(name)}
            </li>`;
        }).join('');
    }
    function selectFile(idx) {
        const f = allFiles[idx];
        if (!f) return;
        currentFile = f.path || f.name || idx;
        renderFileTree();
        loadVersions();
    }

    // 版本列表
    async function loadVersions() {
        if (!currentFile) { document.getElementById('versionContainer').innerHTML = '<div class="empty-block">请从左侧选择一个文件查看版本历史</div>'; return; }
        const container = document.getElementById('versionContainer');
        container.innerHTML = '<div class="empty-block">加载中...</div>';
        const data = await apiGet('/api/v1/recovery/versions?file_path=' + encodeURIComponent(currentFile));
        const versions = (data && (data.versions || data.list)) || [];
        if (!versions.length) { container.innerHTML = '<div class="empty-block">该文件暂无历史版本</div>'; return; }
        container.innerHTML = `<ul class="version-list">${versions.map((v,i)=>`<li class="version-item">
            <div class="version-head">
                <span class="version-time">${esc(v.time||v.timestamp||'—')}</span>
                <span class="version-meta">${formatSize(v.size||0)} · ${esc(v.hash||v.checksum||'')}</span>
            </div>
            ${v.note ? `<div style="font-size:12px;color:var(--text-muted)">${esc(v.note)}</div>` : ''}
            <div class="version-actions">
                <button class="btn btn-primary btn-sm" onclick="restoreVersion('${esc(currentFile)}',${i},'${esc(v.version_id||v.id||'')}')">恢复</button>
                <button class="btn btn-danger btn-sm" onclick="deleteVersion('${esc(currentFile)}',${i},'${esc(v.version_id||v.id||'')}')">删除版本</button>
            </div>
        </li>`).join('')}</ul>`;
    }

    async function restoreVersion(path, idx, id) {
        if (!confirm('确认将该文件恢复到此版本？当前版本将被覆盖。')) return;
        // 走通用可取消任务接口：后端 restore_version 分块复制并在块间检查取消令牌
        const job = await apiPost('/api/v1/jobs', {
            kind: 'recovery-restore',
            params: { file_path: path, version_id: id }
        });
        if (!job || !job.task_id) { showToast('恢复任务启动失败', true); return; }
        restoreJobId = job.task_id;
        setCancelBtn('btnCancelRestore', true, false, '正在取消…', '取消恢复');
        const data = await pollJobUntilDone(job.task_id);
        setCancelBtn('btnCancelRestore', false, false, '正在取消…', '取消恢复');
        restoreJobId = null;
        if (data && data.cancelled) {
            // 取消是正常路径：中性黄提示，且不留下半截文件（后端临时文件已清理）
            showToast('恢复已取消，文件未被修改', false, true);
            loadVersions();
            return;
        }
        if (data && data.error) { showToast('恢复失败：' + data.error, true); return; }
        if (data && data.ok) { showToast('恢复成功'); loadVersions(); loadStats(); loadFiles(); }
        else { showToast('恢复失败', true); }
    }

    async function cancelRestore() {
        if (!restoreJobId) return;
        setCancelBtn('btnCancelRestore', true, true, '正在取消…', '取消恢复');
        await apiPost('/api/v1/jobs/' + restoreJobId + '/cancel');
        showToast('已请求取消恢复，正在停止…', false, true);
    }
    async function deleteVersion(path, idx, id) {
        if (!confirm('确认删除此版本？此操作不可撤销。')) return;
        const r = await apiPost('/api/v1/recovery/delete-version', { file_path:path, version_id:id });
        if (r) loadVersions();
    }

    // 快照设置
    async function loadSettings() {
        const data = await apiGet('/api/v1/recovery/settings');
        if (!data) return;
        const dirs = data.watch_dirs || [];
        const dl = document.getElementById('dirList');
        if (dirs.length) {
            dl.innerHTML = dirs.map((d,i)=>`<div class="dir-tag">${esc(d)}<span class="remove" onclick="removeWatchDir(${i})">×</span></div>`).join('');
        }
        if (data.retain_days) document.getElementById('retainDays').value = data.retain_days;
        if (data.storage_limit) document.getElementById('storageLimit').value = data.storage_limit;
    }
    async function addWatchDir() {
        const dir = document.getElementById('dirInput').value.trim();
        if (!dir) { alert('请输入目录路径'); return; }
        const r = await apiPost('/api/v1/recovery/watch-dirs', { dir:dir });
        if (r) { document.getElementById('dirInput').value=''; loadSettings(); loadFiles(); }
    }
    async function removeWatchDir(idx) {
        const r = await apiPost('/api/v1/recovery/watch-dirs/delete', { index:idx });
        if (r) loadSettings();
    }
    async function saveSettings() {
        const body = {
            retain_days: parseInt(document.getElementById('retainDays').value) || 30,
            storage_limit: parseInt(document.getElementById('storageLimit').value) || 5000
        };
        const r = await apiPost('/api/v1/recovery/settings', body);
        if (r) alert('设置已保存');
    }

    window.addEventListener('load', () => {
        loadStats();
        loadFiles();
        loadSettings();
    });
</script>

    <!-- 移动端导航：汉堡按钮 + 遮罩 -->
    <button class="nav-toggle" id="navToggle" aria-label="打开导航" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-overlay" id="navOverlay"></div>
    <script>
    // 移动端汉堡菜单切换：点击按钮展开/收起侧栏，遮罩或 Esc 关闭
    (function () {
        var btn = document.getElementById('navToggle');
        var overlay = document.getElementById('navOverlay');
        var sidebar = document.querySelector('.sidebar');
        if (!btn || !sidebar) return;
        function setOpen(open) {
            sidebar.classList.toggle('open', open);
            if (overlay) overlay.classList.toggle('show', open);
            btn.setAttribute('aria-expanded', String(open));
        }
        btn.addEventListener('click', function () { setOpen(!sidebar.classList.contains('open')); });
        if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
    </script>
</body>
</html>
