<style>
:root {
  --bg-primary: #0a1f2e;
  --bg-secondary: #0e0e14;
  --bg-card: #13131c;
  --bg-hover: #1a1a26;
  --border: #252536;
  --border-light: #2f2f44;
  --text-primary: #f4f4f9;
  --text-secondary: #8f8fab;
  --text-muted: #5c5c75;
  --accent: #00bcd4;
  --accent-dim: rgba(0, 188, 212, 0.12);
  --accent-glow: rgba(0, 188, 212, 0.35);
  --danger: #ff4d6d;
  --danger-dim: rgba(255, 77, 109, 0.12);
  --warning: #ffcc00;
  --warning-dim: rgba(255, 204, 0, 0.12);
  --success: #22c55e;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'DM Sans', -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'Syne', sans-serif;
}

.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ========== SIDEBAR ========== */
.sidebar {
  width: 72px;
  min-width: 72px;
  height: 100vh;
  position: fixed;
  top: 0;
  left: 0;
  background: rgba(14, 14, 20, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 100;
  padding: 20px 8px;
}

.logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 0;
  margin-bottom: 24px;
}

.logo-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  overflow: hidden;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 24px rgba(0, 188, 212, 0.25);
}

.logo-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.logo-text {
  display: none;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.5px;
  color: var(--text-primary);
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  align-items: center;
  width: 100%;
}

.nav-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 12px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0;
    font-weight: 500;
    transition: var(--transition);
    cursor: pointer;
    border: 1px solid transparent;
    position: relative;
}
.nav-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}
.nav-item.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(0, 188, 212, 0.2);
}
.nav-item svg {
    width: 22px;
    height: 22px;
    opacity: 0.85;
}
.nav-item.active svg { opacity: 1; }
.nav-item[href="settings.html"] { margin-top: auto; }

.nav-item:hover::after {
    content: attr(data-title);
    position: absolute;
    left: 100%;
    margin-left: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    z-index: 300;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.nav-item.active:hover::after {
    border-color: rgba(0, 188, 212, 0.3);
    color: var(--accent);
}

.nav-badge {
    position: absolute;
    top: 0;
    right: -2px;
    background: var(--danger);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    min-width: 16px;
    text-align: center;
    border-radius: 10px;
    border: 2px solid var(--bg-primary);
    line-height: 1.4;
}

.nav-group {
    width: 100%;
    text-align: center;
    padding: 14px 0 6px;
    font-size: 0;
    user-select: none;
    position: relative;
}
.nav-group::before {
    content: '';
    display: block;
    width: 20px;
    height: 1px;
    background: var(--border);
    margin: 0 auto;
}


/* ========== MAIN CONTENT ========== */
.main {
  margin-left: 72px;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ========== HEADER ========== */
.header {
  padding: 28px 36px 0;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 6px;
}

.header h1 {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  background: var(--accent);
  color: var(--bg-primary);
  border-radius: 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 700;
  padding: 0 9px;
}

.badge:empty {
  display: none;
}

.header-sub {
  color: var(--text-secondary);
  font-size: 14px;
  padding-left: 0;
}

/* ========== CONTENT WRAPPER ========== */
.content {
  padding: 24px 36px 40px;
  flex: 1;
}

/* ========== FILTER BAR ========== */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-pill {
  padding: 8px 20px;
  border-radius: 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  transition: var(--transition);
  white-space: nowrap;
}

.filter-pill:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--border-light);
}

.filter-pill.active {
  background: var(--accent-dim);
  color: var(--accent);
  border-color: rgba(0, 188, 212, 0.25);
}

/* ========== ACTION BAR ========== */
.action-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: var(--transition);
  white-space: nowrap;
}

.btn-danger {
  background: var(--danger-dim);
  color: var(--danger);
  border: 1px solid rgba(255, 77, 109, 0.2);
}

.btn-danger:hover {
  background: rgba(255, 77, 109, 0.2);
  transform: translateY(-1px);
}

/* ========== LOG LIST ========== */
.log-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.log-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  transition: var(--transition);
}

.log-item:last-child {
  border-bottom: none;
}

.log-item:hover {
  background: var(--bg-hover);
}

.log-item.removing {
  opacity: 0;
  transform: translateX(30px);
  transition: all 0.3s ease;
}

.log-icon {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.log-icon.safe {
  background: var(--accent-dim);
  color: var(--accent);
}

.log-icon.danger {
  background: var(--danger-dim);
  color: var(--danger);
}

.log-icon.warning {
  background: rgba(255, 204, 0, 0.12);
  color: var(--warning);
}

.log-icon svg {
  width: 20px;
  height: 20px;
}

.log-content {
  flex: 1;
  min-width: 0;
}

.log-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
  margin-bottom: 3px;
}

.log-time {
  font-size: 12.5px;
  color: var(--text-muted);
}

.log-status {
  flex-shrink: 0;
}

.status-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2px;
}

.status-badge.safe {
  background: var(--accent-dim);
  color: var(--accent);
}

.status-badge.danger {
  background: var(--danger-dim);
  color: var(--danger);
}

.status-badge.warning {
  background: rgba(255, 204, 0, 0.12);
  color: #e6b800;
}

/* ========== EMPTY STATE ========== */
.empty-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 70px 20px;
  text-align: center;
}

.empty-state.visible {
  display: flex;
}

.empty-state .empty-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--bg-hover);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  color: var(--text-muted);
}

.empty-state .empty-icon svg {
  width: 36px;
  height: 36px;
}

.empty-state h3 {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.empty-state p {
  color: var(--text-muted);
  font-size: 14px;
}

/* ========== TOAST ========== */
.toast-container {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  animation: toastIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: auto;
  min-width: 260px;
}

.toast.removing {
  animation: toastOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

.toast .toast-icon {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.toast-success .toast-icon { color: var(--accent); }
.toast-danger .toast-icon { color: var(--danger); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(60px) scale(0.95); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(0) scale(1); }
  to { opacity: 0; transform: translateX(60px) scale(0.95); }
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  html.light {
    --bg-primary: #f5f5f8;
    --bg-secondary: #eeeef3;
    --bg-card: #ffffff;
    --bg-hover: #e8e8f0;
    --border: #d8d8e4;
    --border-light: #c8c8d4;
    --text-primary: #1a1a2e;
    --text-secondary: #5a5a6e;
    --text-muted: #8a8a9e;
    --accent: #00bcd4;
    --accent-dim: rgba(0, 188, 212, 0.10);
  }
  html.light .sidebar { background: rgba(255, 255, 255, 0.85); }

/* ========== RESPONSIVE ========== */
</style>

            .main { margin-left: 0; max-width: 100%; }
    }
</style>

            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <h3 id="emptyTitle">暂无日志记录</h3>
        <p id="emptyDesc">执行扫描或开启实时保护后，活动记录将显示在此处</p>
      </div>

    </div>
  </main>

</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<script>
  (function() { try { var q = JSON.parse(localStorage.getItem('安盾_quarantine') || '[]'); var b = document.getElementById('quarantineBadge'); if(b) b.textContent = q.length || '0'; } catch(e) {} })();
(function() {
  'use strict';

  const API_BASE = ''; // 动态适配当前 origin

  async function apiGet(path) {
    try { const res = await fetch(`${API_BASE}${path}`); return await res.json(); }
    catch (e) { console.warn('API 不可用:', e.message); return null; }
  }

  async function apiPost(path, body) {
    try {
      const res = await fetch(`${API_BASE}${path}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return await res.json();
    } catch (e) { console.warn('API 不可用:', e.message); return null; }
  }

  // ===== DOM REFS =====
  var logList = document.getElementById('logList');
  var emptyState = document.getElementById('emptyState');
  var emptyTitle = document.getElementById('emptyTitle');
  var emptyDesc = document.getElementById('emptyDesc');
  var logCount = document.getElementById('logCount');
  var btnClearAll = document.getElementById('btnClearAll');
  var actionBar = document.getElementById('actionBar');

  // ===== CURRENT FILTER =====
  var currentFilter = 'all';

  // ===== LOAD DATA FROM API =====
  async function loadActivities() {
    const data = await apiGet('/api/v1/stats/activity');
    if (!data) return [];

    var items = [];

    // Process threats
    for (var i = 0; i < (data.threats || []).length; i++) {
      var t = data.threats[i];
      items.push({
        id: 'threat_' + i,
        type: t.action === 'quarantine' ? 'threat_quarantined' : 'threat_blocked',
        category: 'threat',
        status: 'blocked',
        details: (t.signature || '未知威胁') + (t.path ? ' - ' + t.path.split('\\').pop() : ''),
        timestamp: t.timestamp,
        threatLevel: t.threat_level || 'medium'
      });
    }

    // Process scans
    for (var j = 0; j < (data.scans || []).length; j++) {
      var s = data.scans[j];
      if (s.event === 'scan_complete') {
        var stats = s.stats || {};
        items.push({
          id: 'scan_' + s.task_id,
          type: 'scan_' + (s.scan_type || 'quick'),
          category: 'scan',
          status: 'completed',
          details: '扫描 ' + (stats.files_scanned || 0).toLocaleString() + ' 个文件' + (stats.threats_found ? '，检出 ' + stats.threats_found + ' 个威胁' : ''),
          timestamp: s.timestamp
        });
      }
    }

    // Sort newest first
    items.sort(function(a, b) {
      return new Date(b.timestamp) - new Date(a.timestamp);
    });

    return items;
  }

  // ===== ICON SVG BY MODIFIED LOGIC =====
  function getIconSvg(item) {
    if (item.category === 'threat') {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  }

  function getIconClass(item) {
    return item.category === 'threat' ? 'danger' : 'safe';
  }

  function getStatusBadge(item) {
    if (item.category === 'threat') {
      return '<span class="status-badge danger">已阻止</span>';
    }
    return '<span class="status-badge safe">已完成</span>';
  }

  function getTitle(item) {
    if (item.type.indexOf('scan_quick') !== -1) return '快速扫描完成';
    if (item.type.indexOf('scan_full') !== -1) return '完整扫描完成';
    if (item.type.indexOf('scan_custom') !== -1) return '自定义扫描完成';
    if (item.type.indexOf('scan') !== -1) return '扫描完成';
    if (item.type.indexOf('threat_quarantined') !== -1) return '威胁已隔离';
    if (item.type.indexOf('threat') !== -1) return '威胁已阻止';
    return '活动记录';
  }

  // ===== RENDER =====
  function formatTime(timestamp) {
    var date = new Date(timestamp);
    var now = new Date();
    var diffMs = now - date;
    var diffMin = Math.floor(diffMs / 60000);
    var diffHours = Math.floor(diffMs / 3600000);

    if (isNaN(date.getTime())) return timestamp || '--';
    if (diffMin < 1) return '刚刚';
    if (diffMin < 60) return diffMin + ' 分钟前';
    if (diffHours < 24) return diffHours + ' 小时前';
    if (diffHours < 48) return '昨天 ' + pad2(date.getHours()) + ':' + pad2(date.getMinutes());

    var y = date.getFullYear();
    var mo = pad2(date.getMonth() + 1);
    var d = pad2(date.getDate());
    var h = pad2(date.getHours());
    var min = pad2(date.getMinutes());
    return y + '-' + mo + '-' + d + ' ' + h + ':' + min;
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderLogItem(item) {
    var iconClass = getIconClass(item);
    var iconSvg = getIconSvg(item);
    var title = getTitle(item);
    var timeStr = formatTime(item.timestamp);
    var statusBadge = getStatusBadge(item);

    var div = document.createElement('div');
    div.className = 'log-item';
    div.innerHTML =
      '<div class="log-icon ' + iconClass + '">' + iconSvg + '</div>' +
      '<div class="log-content">' +
        '<div class="log-title">' + escapeHtml(title) + '</div>' +
        '<div class="log-time">' + escapeHtml(timeStr) + (item.details ? ' · ' + escapeHtml(item.details) : '') + '</div>' +
      '</div>' +
      '<div class="log-status">' + statusBadge + '</div>';
    return div;
  }

  function matchesFilter(item) {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'scan') return item.category === 'scan';
    if (currentFilter === 'threat') return item.category === 'threat';
    return true;
  }

  async function renderAll() {
    var allItems = await loadActivities();

    // Filter
    var filtered = allItems.filter(matchesFilter);

    // Update log count
    logCount.textContent = allItems.length;

    // Update action bar visibility
    actionBar.style.display = allItems.length === 0 ? 'none' : '';

    // Render list
    logList.innerHTML = '';

    if (filtered.length === 0) {
      logList.style.display = 'none';
      emptyState.classList.add('visible');
      if (currentFilter === 'all') {
        emptyTitle.textContent = '暂无日志记录';
        emptyDesc.textContent = '执行扫描或拦截威胁后，活动记录将显示在此处';
      } else if (currentFilter === 'scan') {
        emptyTitle.textContent = '暂无扫描记录';
        emptyDesc.textContent = '执行一次病毒扫描后，扫描记录将显示在此处';
      } else {
        emptyTitle.textContent = '暂无威胁记录';
        emptyDesc.textContent = '拦截到威胁后，威胁记录将显示在此处';
      }
    } else {
      logList.style.display = '';
      emptyState.classList.remove('visible');
      filtered.forEach(function(item) {
        logList.appendChild(renderLogItem(item));
      });
    }
  }

  // ===== TOAST =====
  function showToast(message, type) {
    var container = document.getElementById('toastContainer');
    var toast = document.createElement('div');
    toast.className = 'toast ' + (type === 'danger' ? 'toast-danger' : 'toast-success');

    var iconSvg = type === 'danger'
      ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
      : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';

    toast.innerHTML =
      '<span class="toast-icon">' + iconSvg + '</span>' +
      '<span>' + escapeHtml(message) + '</span>';

    container.appendChild(toast);

    setTimeout(function() {
      toast.classList.add('removing');
      toast.addEventListener('animationend', function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      });
    }, 2500);
  }

  // ===== CLEAR ALL LOGS =====
  async function clearAllLogs() {
    if (!confirm('确定要清空全部日志吗？此操作不可撤销。')) return;
    const result = await apiPost('/api/v1/logs/clear', {});
    if (result && result.success) {
      showToast('已清空全部日志', 'success');
    } else {
      showToast('清空日志失败', 'danger');
    }
    renderAll();
  }

  // ===== FILTER =====
  var filterBar = document.getElementById('filterBar');
  filterBar.addEventListener('click', function(e) {
    var pill = e.target.closest('.filter-pill');
    if (!pill) return;

    filterBar.querySelectorAll('.filter-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    currentFilter = pill.dataset.filter;
    renderAll();
  });

  // ===== EVENT LISTENERS =====
  btnClearAll.addEventListener('click', clearAllLogs);

  // ===== INIT =====
  renderAll();

})();
</script>
<!-- 移动端导航：汉堡按钮 + 遮罩 -->
<button class="nav-toggle" id="navToggle" aria-label="打开导航" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="nav-overlay" id="navOverlay"></div>
<script>
// 移动端汉堡菜单切换：点击按钮展开/收起侧栏，遮罩或 Esc 关闭
(function () {
    var btn = document.getElementById('navToggle');
    var overlay = document.getElementById('navOverlay');
    var sidebar = document.querySelector('.sidebar');
    if (!btn || !sidebar) return;
    function setOpen(open) {
        sidebar.classList.toggle('open', open);
        if (overlay) overlay.classList.toggle('show', open);
        btn.setAttribute('aria-expanded', String(open));
    }
    btn.addEventListener('click', function () { setOpen(!sidebar.classList.contains('open')); });
    if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
