<style>
  :root {
    --bg-primary: #0a1f2e;
    --bg-secondary: #0e0e14;
    --bg-card: #13131c;
    --bg-hover: #1a1a26;
    --border: #252536;
    --border-light: #2f2f44;
    --text-primary: #f4f4f9;
    --text-secondary: #8f8fab;
    --text-muted: #5c5c75;
    --accent: #00bcd4;
  --accent-dim: rgba(0, 188, 212, 0.12);
  --accent-glow: rgba(0, 188, 212, 0.35);
    --danger: #ff4d6d;
    --danger-dim: rgba(255, 77, 109, 0.12);
    --warning: #ffcc00;
    --warning-dim: rgba(255, 204, 0, 0.12);
    --success: #22c55e;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 72px; min-width: 72px; height: 100vh;
    position: fixed; left: 0; top: 0;
    background: rgba(14, 14, 20, 0.85);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    align-items: center;
    padding: 20px 8px; z-index: 100; overflow-y: auto;
  }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 0; margin-bottom: 24px; }
  .logo-icon {
    width: 40px; height: 40px; border-radius: 12px;
    overflow: hidden;
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(0, 188, 212, 0.25);
  }
  .logo-icon img { width: 100%; height: 100%; object-fit: cover; }
  .logo-text { display: none; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.5px; color: var(--text-primary); }

  .nav { display: flex; flex-direction: column; gap: 6px; flex: 1; align-items: center; width: 100%; }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 12px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0;
    font-weight: 500;
    transition: var(--transition);
    cursor: pointer;
    border: 1px solid transparent;
    position: relative;
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(0, 188, 212, 0.2); }
  .nav-item svg { width: 22px; height: 22px; opacity: 0.85; }
  .nav-item.active svg { opacity: 1; }
  .nav-item[href="settings.html"] { margin-top: auto; }
  .nav-item:hover::after {
    content: attr(data-title);
    position: absolute;
    left: 100%;
    margin-left: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    z-index: 300;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .nav-item.active:hover::after {
    border-color: rgba(0, 188, 212, 0.3);
    color: var(--accent);
  }
  .nav-badge {
    position: absolute;
    top: 0;
    right: -2px;
    background: var(--danger);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    min-width: 16px;
    text-align: center;
    border-radius: 10px;
    border: 2px solid var(--bg-primary);
    line-height: 1.4;
  }
  .nav-group {
    width: 100%;
    text-align: center;
    padding: 14px 0 6px;
    font-size: 0;
    user-select: none;
    position: relative;
  }
  .nav-group::before {
    content: '';
    display: block;
    width: 20px;
    height: 1px;
    background: var(--border);
    margin: 0 auto;
  }

  /* ===== MAIN CONTENT ===== */
  .main-content { margin-left: 72px; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }

  .top-header {
    height: 72px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 36px; border-bottom: 1px solid var(--border);
    background: var(--bg-primary); position: sticky; top: 0; z-index: 50;
  }
  .top-header .page-title-group { display: flex; align-items: center; gap: 14px; }
  .top-header .page-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: var(--text-primary); }
  .status-pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 600; background: var(--accent-dim); color: var(--accent); }
  .status-pill .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse-dot 1.4s ease-in-out infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.6); } }

  .page-content { flex: 1; padding: 32px 36px 40px; overflow-y: auto; }

  /* ===== STATS GRID ===== */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; transition: var(--transition); }
  .stat-card:hover { border-color: var(--border-light); }
  .stat-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-dim); display: grid; place-items: center; margin-bottom: 16px; }
  .stat-icon.danger { background: var(--danger-dim); }
  .stat-icon.warning { background: var(--warning-dim); }
  .stat-icon svg { width: 22px; height: 22px; }
  .stat-value { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .stat-label { color: var(--text-secondary); font-size: 13px; }

  /* ===== TYPE DISTRIBUTION ===== */
  .type-distribution { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 32px; }
  .section-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 20px; }
  .type-bar-list { display: flex; flex-direction: column; gap: 12px; }
  .type-bar-item { display: flex; align-items: center; gap: 14px; }
  .type-bar-label { min-width: 160px; font-size: 13px; font-weight: 500; color: var(--text-primary); word-break: break-all; }
  .type-bar-track { flex: 1; height: 8px; background: var(--bg-hover); border-radius: 4px; overflow: hidden; }
  .type-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #00b4a6); border-radius: 4px; transition: width 0.6s ease; }
  .type-bar-fill.danger { background: linear-gradient(90deg, var(--danger), #cc3d5a); }
  .type-bar-fill.warning { background: linear-gradient(90deg, var(--warning), #cca800); }
  .type-bar-count { min-width: 50px; text-align: right; font-size: 13px; font-weight: 600; color: var(--text-secondary); font-family: 'Syne', sans-serif; }

  /* ===== SEARCH BAR ===== */
  .search-bar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; }
  .search-input {
    flex: 1; padding: 14px 20px; background: var(--bg-secondary);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-primary); font-size: 14px; font-family: 'DM Sans', sans-serif;
    outline: none; transition: var(--transition);
  }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .search-input::placeholder { color: var(--text-muted); }
  .search-select {
    padding: 14px 16px; background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px;
    font-family: 'DM Sans', sans-serif; outline: none; cursor: pointer;
    transition: var(--transition); min-width: 140px;
  }
  .search-select:focus { border-color: var(--accent); }
  .search-btn {
    padding: 14px 28px; background: var(--accent); border: none;
    border-radius: var(--radius-sm); color: #000; font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: var(--transition);
    white-space: nowrap; display: flex; align-items: center; gap: 8px;
  }
  .search-btn:hover { background: #00b4a6; box-shadow: 0 4px 16px var(--accent-glow); }
  .clear-btn {
    padding: 14px 20px; background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 14px;
    font-weight: 600; cursor: pointer; transition: var(--transition); white-space: nowrap;
  }
  .clear-btn:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-dim); }

  /* ===== HISTORY TABLE ===== */
  .history-table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .history-table { width: 100%; border-collapse: collapse; }
  .history-table thead th {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-muted); text-align: left; padding: 16px 22px;
    border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.15);
  }
  .history-table tbody td { padding: 15px 22px; font-size: 13.5px; color: var(--text-primary); border-bottom: 1px solid rgba(255,255,255,0.03); }
  .history-table tbody tr { transition: var(--transition); }
  .history-table tbody tr:hover { background: rgba(255,255,255,0.02); }
  .history-table tbody tr:last-child td { border-bottom: none; }

  .threat-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .threat-badge.critical { background: var(--danger-dim); color: var(--danger); }
  .threat-badge.high { background: rgba(255, 77, 109, 0.08); color: var(--danger); }
  .threat-badge.medium { background: var(--warning-dim); color: var(--warning); }
  .threat-badge.low { background: var(--accent-dim); color: var(--accent); }
  .threat-badge.unknown { background: var(--bg-hover); color: var(--text-muted); }

  .engine-tag { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; background: var(--bg-hover); color: var(--text-secondary); }
  .hash-cell { font-family: 'Courier New', monospace; font-size: 12px; color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .path-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-muted); text-align: center; }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 14px; opacity: 0.4; }
  .empty-state p { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
  .empty-state span { font-size: 13px; margin-top: 4px; opacity: 0.7; }

  @media (max-width: 1100px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .main-content { margin-left: 0; }
    .stats-grid { grid-template-columns: 1fr; }
    .top-header { padding: 0 20px; }
    .page-content { padding: 24px 20px 32px; }
    .search-bar { flex-direction: column; }
    .history-table thead { display: none; }
    .history-table tbody td { display: flex; justify-content: space-between; padding: 12px 16px; }
    .history-table tbody td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
  }

  html.light {
    --bg-primary: #f5f5f8; --bg-secondary: #eeeef3; --bg-card: #ffffff;
    --bg-hover: #e8e8f0; --border: #d8d8e4; --border-light: #c8c8d4;
    --text-primary: #1a1a2e; --text-secondary: #5a5a6e; --text-muted: #8a8a9e;
    --accent: #00bcd4; --accent-dim: rgba(0, 188, 212, 0.10);
  }
  html.light .sidebar { background: rgba(255, 255, 255, 0.85); }
</style>

        background: var(--bg-card); border: 1px solid var(--border);
        color: var(--text-primary); box-shadow: 0 6px 18px rgba(0,0,0,0.3);

            .main { margin-left: 0; max-width: 100%; }
    }
</style>

        <div class="stat-value" id="statEngines">--</div>
        <div class="stat-label">检测引擎数</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="stat-value" id="statTopType">--</div>
        <div class="stat-label">最常见病毒类型</div>
      </div>
    </div>

    <!-- 病毒类型分布 -->
    <div class="type-distribution">
      <h3 class="section-title">病毒类型分布</h3>
      <div class="type-bar-list" id="typeDistribution">
        <div class="empty-state" style="padding:30px">
          <p>暂无数据</p>
        </div>
      </div>
    </div>

    <!-- 病毒家族分布 -->
    <div class="type-distribution">
      <h3 class="section-title">病毒家族分布 <small style="color:var(--text-muted);font-weight:400">(按病毒类型聚类 TopN)</small></h3>
      <div class="type-bar-list" id="familyDistribution">
        <div class="empty-state" style="padding:30px">
          <p>暂无数据</p>
        </div>
      </div>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索文件路径、病毒类型、特征名..." onkeydown="if(event.key==='Enter')loadHistory()">
      <select class="search-select" id="typeFilter">
        <option value="">所有类型</option>
      </select>
      <select class="search-select" id="engineFilter">
        <option value="">所有引擎</option>
      </select>
      <button class="search-btn" onclick="loadHistory()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        搜索
      </button>
      <button class="clear-btn" onclick="clearMemory()">清空记忆</button>
    </div>

    <!-- 历史记录表格 -->
    <div class="history-table-wrap">
      <div id="historyContainer">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L4 6v6c0 5.3 3.6 10.2 8 11.5 4.4-1.3 8-6.2 8-11.5V6L12 2z"/><circle cx="12" cy="12" r="3"/></svg>
          <p>暂无病毒记录</p>
          <span>扫描检出的病毒将自动记录到这里</span>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  (function() { try { var q = JSON.parse(localStorage.getItem('安盾_quarantine') || '[]'); document.getElementById('quarantineBadge').textContent = q.length || '0'; } catch(e) {} })();

  const API_BASE = ''; // 动态适配当前 origin

  async function apiGet(path) {
    try { const res = await fetch(`${API_BASE}${path}`); return await res.json(); }
    catch (e) { console.warn('API 不可用:', e.message); return null; }
  }

  async function apiPost(path, body) {
    try {
      const res = await fetch(`${API_BASE}${path}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      return await res.json();
    } catch (e) { console.warn('API 不可用:', e.message); return null; }
  }

  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatTime(dateStr) {
    if (!dateStr) return '-';
    try {
      var d = new Date(dateStr);
      return d.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
    } catch(e) { return dateStr; }
  }

  function truncateHash(hash) {
    if (!hash) return '-';
    return hash.length > 20 ? hash.substring(0, 16) + '...' : hash;
  }

  // 加载统计数据
  async function loadStats() {
    var data = await apiGet('/api/v1/history/virus-stats');
    if (!data) return;

    document.getElementById('statTotal').textContent = (data.total_records || 0).toLocaleString();
    document.getElementById('totalRecords').textContent = (data.total_records || 0).toLocaleString();
    document.getElementById('statTypes').textContent = (data.unique_types || []).length;
    document.getElementById('memoryBadge').textContent = data.total_records || 0;

    var engineStats = data.engine_stats || {};
    document.getElementById('statEngines').textContent = Object.keys(engineStats).length;

    // 最常见病毒类型
    var typeCount = data.type_count || {};
    var topType = '-';
    var maxCount = 0;
    for (var t in typeCount) {
      if (typeCount[t] > maxCount) { maxCount = typeCount[t]; topType = t; }
    }
    document.getElementById('statTopType').textContent = topType;

    // 渲染类型分布
    renderTypeDistribution(typeCount);
    // 渲染病毒家族分布（独立端点）
    loadFamily();

    // 填充类型过滤器
    var typeFilter = document.getElementById('typeFilter');
    var currentValue = typeFilter.value;
    typeFilter.innerHTML = '<option value="">所有类型</option>';
    (data.unique_types || []).forEach(function(t) {
      var opt = document.createElement('option');
      opt.value = t; opt.textContent = t + ' (' + (typeCount[t] || 0) + ')';
      typeFilter.appendChild(opt);
    });
    typeFilter.value = currentValue;

    // 填充引擎过滤器
    var engineFilter = document.getElementById('engineFilter');
    var currentEngine = engineFilter.value;
    engineFilter.innerHTML = '<option value="">所有引擎</option>';
    for (var eng in engineStats) {
      var opt = document.createElement('option');
      opt.value = eng; opt.textContent = eng + ' (' + engineStats[eng] + ')';
      engineFilter.appendChild(opt);
    }
    engineFilter.value = currentEngine;
  }

  function renderTypeDistribution(typeCount) {
    var container = document.getElementById('typeDistribution');
    var entries = Object.entries(typeCount || {});
    if (entries.length === 0) {
      container.innerHTML = '<div class="empty-state" style="padding:30px"><p>暂无数据</p></div>';
      return;
    }
    entries.sort(function(a, b) { return b[1] - a[1]; });
    var maxCount = entries[0][1];
    var html = '';
    var colors = ['', 'danger', 'warning'];
    entries.slice(0, 10).forEach(function(entry, i) {
      var pct = maxCount > 0 ? (entry[1] / maxCount * 100) : 0;
      var colorClass = i < 3 ? colors[i] || '' : '';
      html += '<div class="type-bar-item">' +
        '<span class="type-bar-label">' + escapeHtml(entry[0]) + '</span>' +
        '<div class="type-bar-track"><div class="type-bar-fill ' + colorClass + '" style="width:' + pct + '%"></div></div>' +
        '<span class="type-bar-count">' + entry[1] + '</span>' +
      '</div>';
    });
    container.innerHTML = html;
  }

  // 渲染病毒家族分布（复用类型分布的条状样式）
  async function loadFamily() {
    var container = document.getElementById('familyDistribution');
    var data = await apiGet('/api/v1/history/virus-family');
    var families = (data && data.families) ? data.families : [];
    if (families.length === 0) {
      container.innerHTML = '<div class="empty-state" style="padding:30px"><p>暂无家族数据</p></div>';
      return;
    }
    var maxCount = families[0].count || 1;
    var html = '';
    var colors = ['', 'danger', 'warning'];
    families.slice(0, 12).forEach(function(fam, i) {
      var pct = maxCount > 0 ? (fam.count / maxCount * 100) : 0;
      var colorClass = i < 3 ? colors[i] || '' : '';
      html += '<div class="type-bar-item">' +
        '<span class="type-bar-label" title="' + escapeHtml(fam.family) + '">' + escapeHtml(fam.family) + '</span>' +
        '<div class="type-bar-track"><div class="type-bar-fill ' + colorClass + '" style="width:' + pct + '%"></div></div>' +
        '<span class="type-bar-count">' + fam.count + ' <small>(' + fam.ratio + '%)</small></span>' +
      '</div>';
    });
    container.innerHTML = html;
  }

  // 加载历史记录
  async function loadHistory() {
    var keyword = document.getElementById('searchInput').value.trim();
    var virusType = document.getElementById('typeFilter').value;
    var engine = document.getElementById('engineFilter').value;

    var params = 'limit=500';
    if (keyword) params += '&keyword=' + encodeURIComponent(keyword);
    if (virusType) params += '&virus_type=' + encodeURIComponent(virusType);
    if (engine) params += '&engine=' + encodeURIComponent(engine);

    var data = await apiGet('/api/v1/history/viruses?' + params);
    var container = document.getElementById('historyContainer');

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L4 6v6c0 5.3 3.6 10.2 8 11.5 4.4-1.3 8-6.2 8-11.5V6L12 2z"/><circle cx="12" cy="12" r="3"/></svg>' +
        '<p>暂无病毒记录</p>' +
        '<span>扫描检出的病毒将自动记录到这里</span>' +
      '</div>';
      return;
    }

    var html = '<table class="history-table"><thead><tr>' +
      '<th>病毒类型</th><th>特征名</th><th>文件路径</th><th>威胁等级</th><th>检测引擎</th><th>SHA256</th><th>扫描时间</th>' +
    '</tr></thead><tbody>';

    data.forEach(function(item) {
      var level = item.threat_level || 'unknown';
      var levelClass = level;
      if (level === 'critical' || level === 'high') levelClass = 'critical';
      else if (level === 'medium') levelClass = 'medium';
      else if (level === 'low') levelClass = 'low';
      else levelClass = 'unknown';

      html += '<tr>' +
        '<td data-label="病毒类型"><strong>' + escapeHtml(item.virus_type || '-') + '</strong></td>' +
        '<td data-label="特征名">' + escapeHtml(item.signature || '-') + '</td>' +
        '<td data-label="文件路径" class="path-cell" title="' + escapeHtml(item.file_path) + '">' + escapeHtml(item.file_path || '-') + '</td>' +
        '<td data-label="威胁等级"><span class="threat-badge ' + levelClass + '">' + escapeHtml(level) + '</span></td>' +
        '<td data-label="检测引擎"><span class="engine-tag">' + escapeHtml(item.engine || '-') + '</span></td>' +
        '<td data-label="SHA256" class="hash-cell" title="' + escapeHtml(item.sha256) + '">' + escapeHtml(truncateHash(item.sha256)) + '</td>' +
        '<td data-label="扫描时间">' + formatTime(item.scan_time) + '</td>' +
      '</tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  // 清空记忆
  async function clearMemory() {
    if (!confirm('确定要清空所有病毒记忆记录吗？此操作不可撤销。')) return;
    var data = await apiPost('/api/v1/history/clear', {});
    if (data && data.success) {
      loadStats();
      loadHistory();
    } else {
      alert('清空失败，请检查后端服务');
    }
  }

  // 初始化
  function init() {
    loadStats();
    loadHistory();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>

<!-- 移动端导航：汉堡按钮 + 遮罩 -->
<button class="nav-toggle" id="navToggle" aria-label="打开导航" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="nav-overlay" id="navOverlay"></div>
<script>
// 移动端汉堡菜单切换：点击按钮展开/收起侧栏，遮罩或 Esc 关闭
(function () {
    var btn = document.getElementById('navToggle');
    var overlay = document.getElementById('navOverlay');
    var sidebar = document.querySelector('.sidebar');
    if (!btn || !sidebar) return;
    function setOpen(open) {
        sidebar.classList.toggle('open', open);
        if (overlay) overlay.classList.toggle('show', open);
        btn.setAttribute('aria-expanded', String(open));
    }
    btn.addEventListener('click', function () { setOpen(!sidebar.classList.contains('open')); });
    if (overlay) overlay.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
</body>
</html>
